openapi: 3.0.0

info:
  title: AIMLES_MLModelPerfEvaluation
  version: 1.0.0-alpha.1
  description: |
    API for AIMLES ML Model Performance Evaluation Service.  
    © 2026, 3GPP Organizational Partners (ARIB, ATIS, CCSA, ETSI, TSDSI, TTA, TTC).   
    All rights reserved.

externalDocs:
  description: >
    3GPP TS 29.482 v20.0.0; Artificial Intelligence Machine Learning Enablement
    (AIMLE) Services; Stage 3.
  url: https://www.3gpp.org/ftp/Specs/archive/29_series/29.482/

servers:
  - url: '{apiRoot}/aimles-mlmpe/v1'
    variables:
      apiRoot:
        default: https://example.com
        description: apiRoot as defined in clause 6.5 of 3GPP TS 29.549

security:
  - {}
  - oAuth2ClientCredentials: []

paths:
  /subscriptions:
    post:
      summary: Request the creation of an Individual ML Model Performance Evaluation Subscription.
      operationId: CreateMlModelPerfEvaluationSub
      tags:
        - ML Model Performance Evaluation Subscription (Collection)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MLModelPerfEvalSub'
      responses:
        '201':
          description: >
            The requested Individual ML Model Performance Evaluation Subscription is
            successfully created and a representation of the created resource is
            returned in the response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MLModelPerfEvalSub'
          headers:
            Location:
              description: Contains the URI of the newly created resource.
              required: true
              schema:
                type: string
        '400':
          $ref: 'TS29122_CommonData.yaml#/components/responses/400'
        '401':
          $ref: 'TS29122_CommonData.yaml#/components/responses/401'
        '403':
          $ref: 'TS29122_CommonData.yaml#/components/responses/403'
        '404':
          $ref: 'TS29122_CommonData.yaml#/components/responses/404'
        '411':
          $ref: 'TS29122_CommonData.yaml#/components/responses/411'
        '413':
          $ref: 'TS29122_CommonData.yaml#/components/responses/413'
        '415':
          $ref: 'TS29122_CommonData.yaml#/components/responses/415'
        '429':
          $ref: 'TS29122_CommonData.yaml#/components/responses/429'
        '500':
          $ref: 'TS29122_CommonData.yaml#/components/responses/500'
        '503':
          $ref: 'TS29122_CommonData.yaml#/components/responses/503'
        default:
          $ref: 'TS29122_CommonData.yaml#/components/responses/default'
      callbacks:
        myNotification:
          '{$request.body#/notifUri}': 
            post:
              summary: Notifies the service consumer on the ML Model Performance Evaluation.
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/MLModelPerfEvalNotif'
              responses:
                '204':
                  description: The notification is successfully received.
                '307':
                  $ref: 'TS29122_CommonData.yaml#/components/responses/307'
                '308':
                  $ref: 'TS29122_CommonData.yaml#/components/responses/308'
                '400':
                  $ref: 'TS29122_CommonData.yaml#/components/responses/400'
                '401':
                  $ref: 'TS29122_CommonData.yaml#/components/responses/401'
                '403':
                  $ref: 'TS29122_CommonData.yaml#/components/responses/403'
                '404':
                  $ref: 'TS29122_CommonData.yaml#/components/responses/404'
                '411':
                  $ref: 'TS29122_CommonData.yaml#/components/responses/411'
                '413':
                  $ref: 'TS29122_CommonData.yaml#/components/responses/413'
                '415':
                  $ref: 'TS29122_CommonData.yaml#/components/responses/415'
                '429':
                  $ref: 'TS29122_CommonData.yaml#/components/responses/429'
                '500':
                  $ref: 'TS29122_CommonData.yaml#/components/responses/500'
                '503':
                  $ref: 'TS29122_CommonData.yaml#/components/responses/503'
                default:
                  $ref: 'TS29122_CommonData.yaml#/components/responses/default'

  /subscriptions/{subscriptionId}:
    parameters:
      - name: subscriptionId
        in: path
        description: >
          Represents the Individual ML Model Performance Evaluation Subscription resource.
        required: true
        schema:
          type: string

    get:
      summary: >
       Retrieve an existing the Individual ML Model Performance Evaluation Subscription
       resource.
      operationId: GetIndMlModelPerfEvaluationSub
      tags:
        - Individual ML Model Performance Evaluation Subscription (Document)
      responses:
        '200':
          description: >
            OK. The requested Individual ML Model Performance Evaluation Subscription
            resource shall be returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MLModelPerfEvalSub'
        '307':
          $ref: 'TS29122_CommonData.yaml#/components/responses/307'
        '308':
          $ref: 'TS29122_CommonData.yaml#/components/responses/308'
        '400':
          $ref: 'TS29122_CommonData.yaml#/components/responses/400'
        '401':
          $ref: 'TS29122_CommonData.yaml#/components/responses/401'
        '403':
          $ref: 'TS29122_CommonData.yaml#/components/responses/403'
        '404':
          $ref: 'TS29122_CommonData.yaml#/components/responses/404'
        '406':
          $ref: 'TS29122_CommonData.yaml#/components/responses/406'
        '429':
          $ref: 'TS29122_CommonData.yaml#/components/responses/429'
        '500':
          $ref: 'TS29122_CommonData.yaml#/components/responses/500'
        '503':
          $ref: 'TS29122_CommonData.yaml#/components/responses/503'
        default:
          $ref: 'TS29122_CommonData.yaml#/components/responses/default'

    put:
      summary: >
        Request the update of an existing Individual ML Model Performance Evaluation
        Subscription resource.
      operationId: UpdateIndMlModelPerfEvaluationSub
      tags:
        - Individual ML Model Performance Evaluation Subscription (Document)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MLModelPerfEvalSub'
      responses:
        '200':
          description: >
            OK. The Individual ML Model Performance Evaluation Subscription resource is
            successfully updated and a representation of the updated resource shall be
            returned in the response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MLModelPerfEvalSub'
        '204':
          description: >
            No Content. The Individual ML Model Performance Evaluation Subscription
            resource is successfully updated and no content is returned in the
            response body.
        '307':
          $ref: 'TS29122_CommonData.yaml#/components/responses/307'
        '308':
          $ref: 'TS29122_CommonData.yaml#/components/responses/308'
        '400':
          $ref: 'TS29122_CommonData.yaml#/components/responses/400'
        '401':
          $ref: 'TS29122_CommonData.yaml#/components/responses/401'
        '403':
          $ref: 'TS29122_CommonData.yaml#/components/responses/403'
        '404':
          $ref: 'TS29122_CommonData.yaml#/components/responses/404'
        '411':
          $ref: 'TS29122_CommonData.yaml#/components/responses/411'
        '413':
          $ref: 'TS29122_CommonData.yaml#/components/responses/413'
        '415':
          $ref: 'TS29122_CommonData.yaml#/components/responses/415'
        '429':
          $ref: 'TS29122_CommonData.yaml#/components/responses/429'
        '500':
          $ref: 'TS29122_CommonData.yaml#/components/responses/500'
        '503':
          $ref: 'TS29122_CommonData.yaml#/components/responses/503'
        default:
          $ref: 'TS29122_CommonData.yaml#/components/responses/default'

    patch:
      summary: >
        Request the modification of an existing ML Model Performance Evaluation Subscription
        resource.
      operationId: ModifyIndMlModelPerfEvaluationSub
      tags:
        - Individual ML Model Performance Evaluation Subscription (Document)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MLModelPerfEvalSubPatch'
      responses:
        '200':
          description: >
            OK. The Individual ML Model Performance Evaluation Subscription resource is
            successfully modified and a representation of the updated resource shall
            be returned in the response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MLModelPerfEvalSub'
        '204':
          description: >
            No Content. The Individual ML Model Performance Evaluation Subscription
            resource is successfully modified and no content is returned in the
            response body.
        '307':
          $ref: 'TS29122_CommonData.yaml#/components/responses/307'
        '308':
          $ref: 'TS29122_CommonData.yaml#/components/responses/308'
        '400':
          $ref: 'TS29122_CommonData.yaml#/components/responses/400'
        '401':
          $ref: 'TS29122_CommonData.yaml#/components/responses/401'
        '403':
          $ref: 'TS29122_CommonData.yaml#/components/responses/403'
        '404':
          $ref: 'TS29122_CommonData.yaml#/components/responses/404'
        '411':
          $ref: 'TS29122_CommonData.yaml#/components/responses/411'
        '413':
          $ref: 'TS29122_CommonData.yaml#/components/responses/413'
        '415':
          $ref: 'TS29122_CommonData.yaml#/components/responses/415'
        '429':
          $ref: 'TS29122_CommonData.yaml#/components/responses/429'
        '500':
          $ref: 'TS29122_CommonData.yaml#/components/responses/500'
        '503':
          $ref: 'TS29122_CommonData.yaml#/components/responses/503'
        default:
          $ref: 'TS29122_CommonData.yaml#/components/responses/default'

    delete:
      summary: Remove the Individual ML Model Performance Evaluation Subscription.
      operationId: UnsubscribeIndMlModelPerfEvaluationSub
      tags:
        - Individual ML Model Performance Evaluation Subscription (Document)
      responses:
        '204':
          description: >
            The individual ML Model Performance Evaluation Subscription resource
            matching the subscriptionId is deleted.
        '307':
          $ref: 'TS29122_CommonData.yaml#/components/responses/307'
        '308':
          $ref: 'TS29122_CommonData.yaml#/components/responses/308'
        '400':
          $ref: 'TS29122_CommonData.yaml#/components/responses/400'
        '401':
          $ref: 'TS29122_CommonData.yaml#/components/responses/401'
        '403':
          $ref: 'TS29122_CommonData.yaml#/components/responses/403'
        '404':
          $ref: 'TS29122_CommonData.yaml#/components/responses/404'
        '429':
          $ref: 'TS29122_CommonData.yaml#/components/responses/429'
        '500':
          $ref: 'TS29122_CommonData.yaml#/components/responses/500'
        '503':
          $ref: 'TS29122_CommonData.yaml#/components/responses/503'
        default:
          $ref: 'TS29122_CommonData.yaml#/components/responses/default'

components:
  securitySchemes:
    oAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: '{tokenUrl}'
          scopes: {}

  schemas:
    MLModelPerfEvalSub:
      description: Represents the ML Model Performance Evaluation Subscription.
      type: object
      properties:
        mlModelId:
          type: string
        valServId:
          type: string
        profId:
          type: string
        notifUri:
          $ref: 'TS29122_CommonData.yaml#/components/schemas/Uri'
        suppFeat:
          $ref: 'TS29571_CommonData.yaml#/components/schemas/SupportedFeatures'
      required:
        - mlModelId
        - valServId
        - profId
        - notifUri

    MLModelPerfEvalSubPatch:
      description: >
        Represents the ML Model Performance Evaluation Subscription Patch.
      type: object
      properties:
        mlModelId:
          type: string
        valServId:
          type: string
        profId:
          type: string
        notifUri:
          $ref: 'TS29122_CommonData.yaml#/components/schemas/Uri'

    MLModelPerfEvalNotif:
      description: >
        Represents the ML Model Performance Evaluation Notification.
      type: object
      properties:
        mlModelId:
          type: string
        valServId:
          type: string
        perfInfo:
          $ref: '#/components/schemas/MLModelPerfInfo'
      required:
        - mlModelId
        - valServId
        - perfInfo

    MLModelPerfInfo:
      description: >
        Represents the ML Model Performance Information.
      type: object
      properties:
        accuracy:
          $ref: 'TS29571_CommonData.yaml#/components/schemas/Float'
        f1score:
          $ref: 'TS29571_CommonData.yaml#/components/schemas/Float'
        auc:
          $ref: 'TS29571_CommonData.yaml#/components/schemas/Float'
        precision:
          $ref: 'TS29571_CommonData.yaml#/components/schemas/Float'
        recall:
          $ref: 'TS29571_CommonData.yaml#/components/schemas/Float'
        specificity:
          $ref: 'TS29571_CommonData.yaml#/components/schemas/Float'
        logLoss:
          $ref: 'TS29571_CommonData.yaml#/components/schemas/Float'
      required:
        - accuracy
        - f1score
        - auc

#
# SIMPLE DATA TYPES
#

