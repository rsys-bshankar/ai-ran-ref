openapi: 3.0.1
info:
  title: Scenario specific Intent Expectations - RadioNetworkExpectation
  version: 20.0.0
  description: >-
    OAS 3.0.1 definition of scenario specific Intent Expectations - RadioNetworkExpectation
    © 2026, 3GPP Organizational Partners (ARIB, ATIS, CCSA, ETSI, TSDSI, TTA, TTC).
    All rights reserved.
externalDocs:
  description: 3GPP TS 28.312; Intent driven management services for mobile networks
  url: http://www.3gpp.org/ftp/Specs/archive/28_series/28.312/
paths: {}
components:
  schemas:

    #-------Definition of the Scenario specific IntentExpectation dataType ----------#    
    RadioNetworkExpectation:
      description: >-
        This data type is the "IntentExpectation" data type with specialisations to represent MnS consumer's expectations for radio network delivering and performance assurance    
      type: object
      properties:
        expectationId:
          type: string
        expectationVerb:
           $ref: 'TS28312_IntentNrm.yaml#/components/schemas/ExpectationVerb'
        expectationObject:
          $ref: '#/components/schemas/RadioNetworkExpectationObject'
        expectationTargets:
          type: array
          uniqueItems: true
          items:
            type: object
            oneOf:
              - $ref: '#/components/schemas/WeakRSRPRatioTarget'
              - $ref: '#/components/schemas/LowSINRRatioTarget'
              - $ref: '#/components/schemas/AveULRANUEThptTarget'
              - $ref: '#/components/schemas/AveDLRANUEThptTarget'
              - $ref: '#/components/schemas/LowULRANUEThptRatioTarget'
              - $ref: '#/components/schemas/LowDLRANUEThptRatioTarget' 
              - $ref: '#/components/schemas/HighULPrbLoadRatioTarget'
              - $ref: '#/components/schemas/HighDLPrbLoadRatioTarget'
              - $ref: '#/components/schemas/AveULPrbLoadTarget'
              - $ref: '#/components/schemas/AveDLPrbLoadTarget'
              - $ref: '#/components/schemas/RANEnergyConsumptionTarget'
              - $ref: '#/components/schemas/RANEnergyEfficiencyTarget'
              - $ref: '#/components/schemas/ActiveUEsNumTarget'
              - $ref: '#/components/schemas/PRBsTarget'
              - $ref: '#/components/schemas/InterRAThandoverTarget'
              - $ref: 'TS28312_IntentNrm.yaml#/components/schemas/ExpectationTarget'
        expectationContexts:
          type: array
          uniqueItems: true
          items:
            type: object
            oneOf:
             - $ref: '#/components/schemas/TargetAssuranceTimeContext'
             - $ref: 'TS28312_IntentNrm.yaml#/components/schemas/SchedulingTimeContext'
             - $ref: 'TS28312_IntentNrm.yaml#/components/schemas/DecompositionAssistingContext'             
             - $ref: '#/components/schemas/PrbHighLoadRatioContext'
             - $ref: 'TS28312_IntentNrm.yaml#/components/schemas/Context'
      required:
        - expectationId
        - expectationObject
        - expectationTargets

   #-------Definition of the IntentExpectation dataType ----------#    

   #-------Definition of the scenario specific ExpectationObject dataType ----------#    
    RadioNetworkExpectationObject:
      description: >-
        This data type is the "ExpectationObject" data type with specialisations for RadioNetworkExpectation
      type: object
      properties:
        objectType:
          type: string
          enum:
            - RAN_SUBNETWORK
        objectInstance:
          $ref: 'TS28623_ComDefs.yaml#/components/schemas/Dn'
        objectContexts:
          type: array
          uniqueItems: true
          items:
            type: object
            oneOf:
              - $ref: '#/components/schemas/CoverageAreaPolygonContext'
              - $ref: '#/components/schemas/CoverageTACContext'
              - $ref: '#/components/schemas/TimeBasedAreaContext'
              - $ref: '#/components/schemas/CellContext'
              - $ref: '#/components/schemas/PLMNContext'
              - $ref: '#/components/schemas/DlFrequencyContext'
              - $ref: '#/components/schemas/UlFrequencyContext'
              - $ref: '#/components/schemas/RATContext'
              - $ref: '#/components/schemas/UEGroupContext'
              - $ref: 'TS28312_IntentNrm.yaml#/components/schemas/Context' 

  #-------Definition of the scenario specific ExpectationObject dataType ----------#    

   #-------Definition of the Scenario specific ExpectationTarget dataType----------#     
    WeakRSRPRatioTarget:
      description: >-
        This data type is the "ExpectationTarget" data type with specialisations for WeakRSRPRatioTarget. It describes
        the downlink weak coverage ratio target for the RAN SubNetwork that the intent expectation is applied. 
        The numerator is the number of the cells with downlink weak RSRP, and the denominator is the total number
        of cells of the RAN Subnetwork in the specified area.
      type: object
      properties:
        targetName:
          type: string
          enum:
            - WeakRSRPRatio
        targetCondition:
          type: string
          enum:
            - IS_LESS_THAN
        targetValueRange:
          type: integer
          minimum: 0
          maximum: 100
        targetContexts:
          $ref: '#/components/schemas/WeakRSRPContext'
    WeakRSRPContext:
      description: >-
        This data type is the "TargetContext" data type with specialisations for WeakRSRPContext. It describes the threshold
        for downlink weak RSRP of the cells (see RSRP measurements in TS 28.552 [6]) of the RAN SubNetwork that the intent 
        expectation is applied.
      type: object
      properties:
        contextAttribute:
          type: string
          enum:
            - WeakRSRPThreshold
        contextCondition:
          type: string
          enum:
            - IS_LESS_THAN
        contextValueRange:
          type: number
    LowSINRRatioTarget:
      description: >-
        This data type is the "ExpectationTarget" data type with specialisations for LowSINRatioTarget.It describes the low SINR 
        ratio target for the RAN SubNetwork that the intent expectation is applied. The numerator is the number of the cells with
        low SINR, and the denominator is the total number of cells of the RAN Subnetwork in the specified area.
      type: object
      properties:
        targetName:
          type: string
          enum:
            - LowSINRRatio
        targetCondition:
          type: string
          enum:
            - IS_LESS_THAN
        targetValueRange:
          type: integer
          minimum: 0
          maximum: 100
        targetContexts:
          $ref: '#/components/schemas/LowSINRContext'
    LowSINRContext:
      description: >-
        This data type is the "TargetContext" data type with specialisations for LowSINRContext.It describes the threshold for 
        low SINR of the cells (see SINR measurements in TS 28.552 [6]) of the RAN SubNetwork that the intent expectation is applied.
      type: object
      properties:
        contextAttribute:
          type: string
          enum:
            - LowSINRThreshold
        contextCondition:
          type: string
          enum:
            - IS_LESS_THAN
        contextValueRange:
          type: integer
    AveULRANUEThptTarget:
      description: >-
        This data type is the "ExpectationTarget" data type with specialisations for AveULRANUEThptTarget.It describes the average
        UL RAN UE throughput target for RAN SubNetwork (see UL RAN UE throughput for a sub-network in TS 28.554[11]) that the intent
        expectation is applied.
      type: object
      properties:
        targetName:
          type: string
          enum:
            - AveULRANUEThpt
        targetCondition:
          type: string
          enum:
            - IS_GREATER_THAN
        targetValueRange:
          type: integer
        targetContexts:
          type: array
          items:
            type: object
            oneOf:
              - $ref: '#/components/schemas/UlFrequencyContext'
              - $ref: '#/components/schemas/RATContext'
    AveDLRANUEThptTarget:
      description: >-
        This data type is the "ExpectationTarget" data type with specialisations for AveDLRANUEThptTarget.It describes the average
        DL RAN UE throughput target for RAN SubNetwork (see DL RAN UE throughput for a sub-network in TS 28.554[11]) that the intent
        expectation is applied.    
      type: object
      properties:
        targetName:
          type: string
          enum:
            - AveDLRANUEThpt
        targetCondition:
          type: string
          enum:
            - IS_GREATER_THAN
        targetValueRange:
          type: integer
        targetContexts:
          type: array
          items:
            type: object
            oneOf:
              - $ref: '#/components/schemas/DlFrequencyContext'
              - $ref: '#/components/schemas/RATContext'
    LowULRANUEThptRatioTarget:
      description: >-
        This data type is the "ExpectationTarget" data type with specialisations for LowULRANUEThptRatioTarget.It describes the low
        UL RAN UE throughput ratio target for the RAN SubNetwork that the intent expectation is applied. The numerator is the number
        of the cells with low UL RAN UE throughput, and the denominator is the total number of cells of the RAN Subnetwork in the 
        specified area.        
      type: object
      properties:
        targetName:
          type: string
          enum:
            - LowULRANUEThptRatio
        targetCondition:
          type: string
          enum:
            - IS_LESS_THAN
        targetValueRange:
          type: integer
          minimum: 0
          maximum: 100
        targetContexts:
          $ref: '#/components/schemas/LowULRANUEThptContext'
    LowULRANUEThptContext:
      description: >-
        This data type is the "TargetContext" data type with specialisations for LowULRANUEThptContext.It describes the threshold 
        for the low UL RAN UE throughput cells (see average UL RAN UE throughput in gNB and distribution of UL UE throughput in gNB
        in TS 28.552[6]) of the RAN SubNetwork that the intent expectation is applied.
      type: object
      properties:
        contextAttribute:
          type: string
          enum:
            - LowULRANUEThptThreshold
        contextCondition:
          type: string
          enum:
            - IS_LESS_THAN
        contextValueRange:
          type: number
    LowDLRANUEThptRatioTarget:
      description: >-
        This data type is the "ExpectationTarget" data type with specialisations for LowDLRANUEThptRatioTarget. It describes
        the low DL RAN UE throughput ratio target for the RAN SubNetwork that the intent expectation is applied.The numerator
        is the number of the cells with low DL RAN UE throughput, and the denominator is the total number of cells of the 
        RAN Subnetwork in the specified area.
      type: object
      properties:
        targetName:
          type: string
          enum:
            - LowDLRANUEThptRatio
        targetCondition:
          type: string
          enum:
            - IS_LESS_THAN
        targetValueRange:
          type: integer
          minimum: 0
          maximum: 100
        targetContexts:
          $ref: '#/components/schemas/LowDLRANUEThptContext'
    LowDLRANUEThptContext:
      description: >-
        This data type is the "TargetContext" data type with specialisations for LowDLRANUEThptContext.It describes the threshold
        for the low DL RAN UE throughput cells ((see average DL RAN UE throughput in gNB and distribution of DL UE throughput in gNB
        in TS 28.552[6]) ) of the RAN SubNetwork that the intent expectation is applied.      
      type: object
      properties:
        contextAttribute:
          type: string
          enum:
            - LowDLRANUEThptThreshold
        contextCondition:
          type: string
          enum:
            - IS_LESS_THAN
        contextValueRange:
          type: number
    HighULPrbLoadRatioTarget:
      description: >-
        This data type is the "ExpectationTarget" data type with specialisations for HighULPrbLoadRatioTarget. It describes the high UL
        PRB load ratio target (as percentage) for the RAN SubNetwork that the intent expectation is applied. The numerator is the number
        of the cells with high UL PRB load, and the denominator is the total number of cells of the RAN Subnetwork in the specified area.         
      type: object
      properties:
        targetName:
          type: string
          enum:
            - HighULPrbLoadRatio
        targetCondition:
          type: string
          enum:
            - IS_LESS_THAN
        targetValueRange:
          type: integer
          minimum: 0
          maximum: 100
        targetContexts:
          $ref: '#/components/schemas/HighULPrbLoadContext'
    HighULPrbLoadContext:
      description: >-
        This data type is the "TargetContext" data type with specialisations for HighULPrbLoadContext.It describes the threshold for high
        uplink PRB load (i.e. UL Total PRB Usage in TS 28.552 [12] to represent the percentage of UL PRBs used) of the cells of the RAN
        SubNetwork in the specified area that the intent expectation is applied.
      type: object
      properties:
        contextAttribute:
          type: string
          enum:
            - HighULPrbLoadThreshold
        contextCondition:
          type: string
          enum:
            - IS_LESS_THAN
        contextValueRange:
          type: integer
          minimum: 0
          maximum: 100
    HighDLPrbLoadRatioTarget:
      description: >-
        This data type is the "ExpectationTarget" data type with specialisations for HighDLPrbLoadRatioTarget.It describes the high DL PRB
        load ratio target (as percentage) for the RAN SubNetwork that the intent expectation is applied. The numerator is the number of the
        cells with high DL PRB load, and the denominator is the total number of cells of the RAN Subnetwork in the specified area.         
      type: object
      properties:
        targetName:
          type: string
          enum:
            - HighDLPrbLoadRatio
        targetCondition:
          type: string
          enum:
            - IS_LESS_THAN
        targetValueRange:
          type: integer
          minimum: 0
          maximum: 100
        targetContexts:
          $ref: '#/components/schemas/HighDLPrbLoadContext'
    HighDLPrbLoadContext:
      description: >-
        This data type is the "TargetContext" data type with specialisations for HighDLPrbLoadContext.It describes the threshold for high downlink
        PRB load (i.e. DL Total PRB Usage in TS 28.552 [12] to represent the percentage of DL PRBs used) of the cells of the RAN SubNetwork in the
        specified area that the intent expectation is applied. 
      type: object
      properties:
        contextAttribute:
          type: string
          enum:
            - HighDLPrbLoadThreshold
        contextCondition:
          type: string
          enum:
            - IS_LESS_THAN
        contextValueRange:
          type: integer
          minimum: 0
          maximum: 100
    AveULPrbLoadTarget:
      description: >-
        This data type is the "ExpectationTarget" data type with specialisations for AveULPrbLoadTarget.It describes the average uplink PRB load target
        (i.e. UL Total PRB Usage in TS 28.552 [12] to represent the percentage of UL PRBs used) of the cells of the RAN SubNetwork that the intent
        expectation is applied.    
      type: object
      properties:
        targetName:
          type: string
          enum:
            - AveULPrbLoad
        targetCondition:
          type: string
          enum:
            - IS_LESS_THAN
        targetValueRange:
          type: integer
          minimum: 0
          maximum: 100
    AveDLPrbLoadTarget:
      description: >-
        This data type is the "ExpectationTarget" data type with specialisations for AveDLPrbLoadTarget.It describes the average dowlink PRB load
        (i.e. DL Total PRB Usage in TS 28.552 [12] to represent the percentage of DL PRBs used) target for RAN SubNetwork that the intent expectation
        is applied.    
      type: object
      properties:
        targetName:
          type: string
          enum:
            - AveDLPrbLoad
        targetCondition:
          type: string
          enum:
            - IS_LESS_THAN
        targetValueRange:
          type: integer
          minimum: 0
          maximum: 100
    RANEnergyConsumptionTarget:
      description: >-
        This data type is the "ExpectationTarget" data type with specialisations for RANEnergyConsumptionTarget.It describes the RAN energy consumption
        target for RAN SubNetwork that the intent expectation is applied. The definition for RAN energy consumption see ECNG-RAN in clause 6.7.3.4.1 in
        TS 28.554 [11].
      type: object
      properties:
        targetName:
          type: string
          enum:
            - RANEnergyConsumption
        targetCondition:
          type: string
          enum:
            - IS_LESS_THAN
        targetValueRange:
          type: integer
    RANEnergyEfficiencyTarget:
      description: >-
        This data type is the "ExpectationTarget" data type with specialisations for RANEnergyEfficiencyTarget.It describes the RAN energy efficiency target
        for RAN SubNetwork that the intent expectation is applied. The unit of this target is bit/J. The definition for RAN energy efficiency target for RAN
        SubNetwork see EEMN,DV in clause 6.7.1.1 in TS 28.554 [11].
      type: object
      properties:
        targetName:
          type: string
          enum:
            - RANEnergyEfficiency
        targetCondition:
          type: string
          enum:
            - IS_GREATER_THAN
        targetValueRange:
          type: integer
    ActiveUEsNumTarget:
      description: >-
        This data type is the "ExpectationTarget" data type with specialisations for ActiveUEsNumTarget.
        It describes the number of Active UEs for the specified areas. This target is related to Mean
        number of Active UEs in the DL per cell and Mean number of Active UEs in the UL per cell defined
        in 3GPP TS 28.552 [6].
      type: object
      properties:
        targetName:
          type: string
          enum:
            - ActiveUEsNum
        targetCondition:
          type: string
          enum:
            - IS_WITHIN_RANGE
        targetValueRange:
          type: array
          description: >- 
           a pair of integer values to represent minimum number of active UEs and maximum number of active UEs.
          items:
            type: integer
            minItems: 1
            maxItems: 2
    PRBsTarget:
      description: >-
        This data type is the "ExpectationTarget" data type with specialisations for PRBsTarget.
        It describes total available number of physical resource blocks (PRBs). This target is equal to the difference between the DL total available PRB plus UL total available PRB of operator A and the DL total available PRB plus UL total available PRB of operator B. DL total available PRB and UL total available PRB defined in clause 5.1.1.2.6 and 5.1.1.2.8 of TS 28.552 [12].
      type: object
      properties:
        targetName:
          type: string
          enum:
            - pRBS
        targetCondition:
          type: string
          enum:
            - IS_EQUAL_TO
        targetValueRange:
          type: integer
    InterRAThandoverTarget:
      description: >-
        This data type is the "ExpectationTarget" data type with specialisations for PRBsTarget.
        it shows how often a handover from 5GS to EPS is successful. The InterRAThandover target is equal to the difference between 5GS to EPS handover success rate of operator A and 5GS to EPS handover success rate of operator B. For details see attribute 5GS to EPS handover success rate defined in clause 6.6.4 of TS 28.554 [11].
      type: object
      properties:
        targetName:
          type: string
          enum:
            - InterRATHandover
        targetCondition:
          type: string
          enum:
            - IS_LESS_THAN
        targetValueRange:
          type: integer
          minimum: 0
          maximum: 100
  #-------Definition of the Scenario specific ExpectationTarget dataType----------#

   #-------Definition of the concrete ObjectContext dataType----------------#
    CoverageAreaPolygonContext:
      description: >-
        This data type is the "ObjectContext" data type with specialisations for CoverageAreaPolygonContext.It describes the coverage areas for the RAN SubNetwork that the
        intent expectation is applied in the form of polygon.
      type: object
      properties:
        contextAttribute:
          type: string
          enum:
            - CoverageAreaPolygon
        contextCondition:
          type: string
          enum:
            - IS_ALL_OF
        contextValueRange:
          $ref: 'TS28623_ComDefs.yaml#/components/schemas/GeoArea'
    CoverageTACContext:
      description: >-
        This data type is the "ObjectContext" data type with specialisations for CoverageTACContext.It describes the coverage areas for the RAN SubNetwork that the intent
        expectation is applied in the form of TAC.     
      type: object
      properties:
        contextAttribute:
          type: string
          enum:
            - CoverageAreaTac
        contextCondition:
          type: string
          enum:
             - IS_ALL_OF
        contextValueRange:
          type: array
          uniqueItems: true
          items:
            $ref: "TS28623_ComDefs.yaml#/components/schemas/Tac"
    CellContext:
      description: >-
        This data type is the "ObjectContext" data type with specialisations for CellContext.
        It describes the coverage areas for the RAN SubNetwork or Radio Service that the intent expectation is applied
        in the form of a list of cells (including E-UTRAN cells identified by E-UTRAN-CGI and NR cells
        identified by NG-RAN CGI).
      type: object
      properties:
        contextAttribute:
          type: string
          enum:
            - Cell
        contextCondition:
          type: string
          enum:
             - IS_ALL_OF
        contextValueRange:
          type: array
          items:
            $ref: "#/components/schemas/CellId"
    CellId:
      oneOf:
        - $ref: 'TS28623_ComDefs.yaml#/components/schemas/EutraCellId'
        - $ref: 'TS28623_ComDefs.yaml#/components/schemas/NrCellId'
    TimeBasedAreaContext:
      description: >- 
        This data type is the "ObjectContext" data type with specialisations for TimeBasedAreaContext. 
        It describes the areas for specific times for the RAN SubNetwork that the intent expectation is 
        applied in the form of a <GeoArea, TimeWindow> list.
      type: object
      properties:
        contextAttribute:
          type: string
          enum:
            - TimeBasedArea
        contextCondition:
          type: string
          enum:
            - IS_ALL_OF
        contextValueRange:
          type: array
          items:
            $ref: "#/components/schemas/TimeBasedArea"
    TimeBasedArea:
      type: object
      properties:
        geoArea:
          $ref: 'TS28623_ComDefs.yaml#/components/schemas/GeoArea'
        timeWindow:
          $ref: 'TS28623_ComDefs.yaml#/components/schemas/TimeWindow'
    PLMNContext:
      description: >-
        This data type is the "ObjectContext" data type with specialisations for PLMNContext
      type: object
      properties:
        contextAttribute:
          type: string
          enum:
            - PLMN
        contextCondition:
          type: string
          enum:
            - IS_ALL_OF
        contextValueRange:
          type: array
          uniqueItems: true
          items:
            $ref: 'TS28623_ComDefs.yaml#/components/schemas/PlmnId'
    GeoCoordinateContext:
      description: >-
        This data type is the "ObjectContext" data type with specialisations for GeoCoordinateContext.
        It describes the location (i.e. geocoordinate) that radio service intent is applied.
      type: object
      properties:
        contextAttribute:
          type: string
          enum:
            - GeoCoordinate
        contextCondition:
          type: string
          enum:
             - IS_EQUAL_TO
        contextValueRange:
          $ref: 'TS28623_ComDefs.yaml#/components/schemas/GeoCoordinate'
    CivicAreaContext:
      description: >-
        It describes the coverage areas for the RAN SubNetwork or Radio Service that the intent expectation is applied in the form of     civic area. 
        The civic area supports civic address (e.g. streets, districts, seats, etc.) or location label (e.g. hotel name, school name)
      type: object
      properties:
        contextAttribute:
          type: string
          enum:
            - CivicArea
        contextCondition:
          type: string
          enum:
             - IS_ALL_OF
        contextValueRange:
          type: array
          items:
            $ref: 'TS28312_IntentNrm.yaml#/components/schemas/CivicArea'
    DlFrequencyContext:
      description: >-
        This data type is the "Context" data type with specialisations for Object context "DLFrequencyContext". It describes the downlink frequency information (RF reference
        frequencies and/ or the frequency operating band) supported by the RAN SubNetwork or Radio Service that the intent expectation is applied.       
      type: object
      properties:
        contextAttribute:
          type: string
          enum:
            - DlFrequency
        contextCondition:
          type: string
          enum:
            - IS_ALL_OF
        contextValueRange:
          type: array
          uniqueItems: true
          items:
            $ref: 'TS28312_IntentNrm.yaml#/components/schemas/Frequency'
    UlFrequencyContext:
      description: >-
        This data type is the "Context" data type with specialisations for Object context "ULFrequencyContext".It describes the uplink frequency information (RF reference
        frequencies and/ or the frequency operating band) supported by the RAN SubNetwork or Radio Service that the intent expectation is applied.       
      type: object
      properties:
        contextAttribute:
          type: string
          enum:
            - UlFrequency
        contextCondition:
          type: string
          enum:
            - IS_ALL_OF
        contextValueRange:
          type: array
          uniqueItems: true
          items:
            $ref: 'TS28312_IntentNrm.yaml#/components/schemas/Frequency'
    RATContext:
      description: >-
        This data type is the "ObjectContext" data type with specialisations for RATContext.It describes the RAT supported by the RAN SubNetwork that the intent expectation
        is applied.           
      type: object
      properties:
        contextAttribute:
          type: string
          enum:
            - RAT
        contextCondition:
          type: string
          enum:
            - IS_ALL_OF
        contextValueRange:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - UTRAN
              - EUTRAN
              - NR
    UEGroupContext:
      description: >-
        This data type is the "ObjectContext" data type with specialisations for UEGroup([QoSId, SNSSAI, pLMNId])
      type: object
      properties:
        contextAttribute:
          type: string
          enum:
            - UEGroup
        contextCondition:
          type: string
          enum:
            - IS_ALL_OF
        contextValueRange:
          type: array
          uniqueItems: true
          items:
            $ref: "TS28312_IntentNrm.yaml#/components/schemas/UEGroup"

   #-------Definition of the concrete ObjectContext  dataType----------#  

   #-------Definition of the concrete ExpectationContext dataType----------------#

    TargetAssuranceTimeContext:
      description: >-
        This data type is the "Expectation Context" data type with specialisations for TargetAssuranceTimeContext.It describes the timeWindows
        (including startTime, endTime) when the targets in the Intent Expectation need to be assured.       
      type: object
      properties:
        contextAttribute:
          type: string
          enum:
            - TargetAssuranceTime
        contextCondition:
          type: string
          enum:
            - IS_EQUAL_TO
        contextValueRange:
          $ref: 'TS28623_ComDefs.yaml#/components/schemas/TimeWindow' 
    PrbHighLoadRatioContext:
      description: >-
        This data type describes the load condition (i.e. PrbHighLoadRatio) for the radio network 
        that the intent expectation is applied. The detailed PrbHighLoadRatio see PrbHighLoadRatio defined in TS 28.554
      type: object
      properties:
        contextAttribute:
          type: string
          enum:
            - prbHighLoadRatio
        contextCondition:
          type: string
          enum:
            - IS_GREATER_THAN
        contextValueRange:
          type: number
          minimum: 0
          maximum: 1
   #-------Definition of the concrete ExpectationContext dataType----------------#          