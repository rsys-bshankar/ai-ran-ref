components:
  securitySchemes:
    oAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: '{nrfApiRoot}/oauth2/token'
          scopes:
            nadm-dm: Access to the Nadm_DM API
            nadm-dm:aiot-device-profile-data:read: Access to read AIoT Device Profile Data
            nadm-dm:aiot-device-profile-data:modify: Access to update AIoT Device Profile Data
            nadm-dm:af-authorization-data:read: Access to read AF Authorization Data
            nadm-dm:af-authorization-data:subscriptions:create: Access to create the subscriptions of AF Authorization Data Changes
            nadm-dm:af-authorization-data:subscriptions:modify: Access to modify or delete the subscriptions of AF Authorization Data Changes

  schemas:
#
# STRUCTURED TYPES
#

    AiotDevProfileData:
      description: Contains the AIoT Device Profile Data.
      type: object
      required:
        - aiotDevPermId
        - lastKnownAiotfInfo
      properties:
        aiotDevPermId:
          $ref: 'TS29571_CommonData.yaml#/components/schemas/AiotDevPermId'
        lastKnownAiotfInfo:
          $ref: '#/components/schemas/LastKnownAiotfInfo'
        doaCapableDevice:
          type: boolean
          default: false
        subscribedAfInfo:
          $ref: '#/components/schemas/TargetAfInfo'
        deregCallbackUri:
          $ref: 'TS29571_CommonData.yaml#/components/schemas/Uri'
        afInfoNotifyUri:
          $ref: 'TS29571_CommonData.yaml#/components/schemas/Uri'

    LastKnownAiotfInfo:
      description: Contains the Last Known AIoTF Info.
      type: object
      required:
        - lastKnownAiotfInfoInd
      properties:
        lastKnownAiotfInfoInd:
          type: boolean
        lastKnownAiotfId:
          $ref: 'TS29571_CommonData.yaml#/components/schemas/NfInstanceId'
        lastKnownAiotfAddress:
          $ref: 'TS29571_CommonData.yaml#/components/schemas/IpAddr'
        lastKnownAiotfFqdn:
          $ref: 'TS29571_CommonData.yaml#/components/schemas/Fqdn'

    IndividualAfAuthorizationData:
      description: Contains the AF Authorization Data for an individual AF.
      type: object
      required:
        - afId
      properties:
        afId:
          $ref: '#/components/schemas/AfId'
        allowedArea:
          $ref: 'TS29571_CommonData.yaml#/components/schemas/AiotArea'
        allowedServiceOperations:
          type: array
          items:
            $ref: '#/components/schemas/AllowedServiceOperation'
          minItems: 1
        allowedTargetAiotDevices:
          type: array
          items:
            $ref: '#/components/schemas/AllowedTargetAiotDevice'
          minItems: 1

    AllowedTargetAiotDevice:
      description: >
        Contains the permanent AIoT Device ID or the filtering information,
        either aiotDevPermId, or filteringInfo shall be present.
      type: object
      properties:
        aiotDevPermId:
          $ref: 'TS29571_CommonData.yaml#/components/schemas/AiotDevPermId'
        filteringInfo:
          $ref: 'TS29571_CommonData.yaml#/components/schemas/AiotFilteringInformation'

    AfAuthorizationData:
      description: Contains the AF Authorization Data.
      type: object
      required:
        - afAuthData
      properties:
        afAuthData:
          type: object
          description: >
            'Map carrying the AF Authorization Data. 
            The key of the map is the AF ID of the corresponding Authorization Data'
          additionalProperties:
            $ref: '#/components/schemas/IndividualAfAuthorizationData'
          minProperties: 1

    AfAuthorizationDataSubscription:
      description: Contains a AF Authorization Data Change Subscription.
      type: object
      required:
        - notifyCallbackUri
        - notifyCorrelationId
      properties:
        notifyCallbackUri:
          $ref: 'TS29571_CommonData.yaml#/components/schemas/Uri'
        notifyCorrelationId:
          type: string
        afId:
          $ref: '#/components/schemas/AfId'
        expiry:
          $ref: 'TS29571_CommonData.yaml#/components/schemas/DateTime'

    AfAuthorizationDataChangeNotification:
      description: Contains a AF Authorization Data Change Notification.
      type: object
      required:
        - udpateAfAuthData
        - notifyCorrelationId
      properties:
        udpateAfAuthData:
          type: object
          description: >
            'Map carrying the Updated AF Authorization Data. 
            The key of the map is the AF ID of the corresponding Authorization Data'
          additionalProperties:
            $ref: '#/components/schemas/IndividualAfAuthorizationData'
          minProperties: 1
        notifyCorrelationId:
          type: string

    TargetAfInfo:
      description: >
        The information of a target AF which has subscribed to receive the data
        from DO-A capable AIoT device.
      type: object
      required:
        - afId
        - dataRecvUri
      properties:
        afId:
          $ref: '#/components/schemas/AfId'
        dataRecvUri:
          $ref: 'TS29571_CommonData.yaml#/components/schemas/Uri'
        afAddr:
          $ref: 'TS29571_CommonData.yaml#/components/schemas/IpAddr'

    AiotfDeregistrationData:
      description: >
        This datatype is supported by the POST HTTP method, and it includes the
        AIOTF deregistration data.
      type: object
      required:
        - aiotDevPermId
      properties:
        aiotDevPermId:
          $ref: 'TS29571_CommonData.yaml#/components/schemas/AiotDevPermId'
        cause:
          $ref: '#/components/schemas/Cause'

    UpdatedTargetAfInfo:
      description: Indicate the AF address or AF ID.
      required:
        - aiotDevPermId
      properties:
        aiotDevPermId:
          $ref: 'TS29571_CommonData.yaml#/components/schemas/AiotDevPermId'
        targetAfInfo:
            $ref: '#/components/schemas/TargetAfInfo'

#
# SIMPLE TYPES
#

    AfId:
      description: Indicates the identifier used to identify the AF.
      type: string


    AiotDevProfileDataList:
      description: AIoT Device Profile Data of a list of AIoT devices.
      type: object
      required:
        - aiotDevProfileDataList
      properties:
        aiotDevProfileDataList:
          type: array
          items:
            $ref: '#/components/schemas/AiotDevProfileData'
          minItems: 1


#
# ENUMS
#

    AllowedServiceOperation:
      description: The Allowed Service Operation.
      anyOf:
        - type: string
          enum:
            - INVENTORY
            - READ
            - WRITE
            - PERMANENT_DISABLE
        - type: string

    Cause:
      description: Indicates the cause.
      anyOf:
        - type: string
          enum:
            - OPERATIONAL
            - CHANGE_OF_AIOTF
        - type: string
