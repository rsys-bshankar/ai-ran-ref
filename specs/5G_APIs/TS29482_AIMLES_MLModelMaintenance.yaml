openapi: 3.0.0

info:
  title: AIMLES_MLModelMaintenance
  version: 1.0.0-alpha.1
  description: |
    API for AIMLES ML Model Maintenance Service.  
    © 2026, 3GPP Organizational Partners (ARIB, ATIS, CCSA, ETSI, TSDSI, TTA, TTC).   
    All rights reserved.

externalDocs:
  description: >
    3GPP TS 29.482 v20.0.0; Artificial Intelligence Machine Learning Enablement
    (AIMLE) Services; Stage 3.
  url: https://www.3gpp.org/ftp/Specs/archive/29_series/29.482/

servers:
  - url: '{apiRoot}/aimles-mlmm/v1'
    variables:
      apiRoot:
        default: https://example.com
        description: apiRoot as defined in clause 6.5 of 3GPP TS 29.549

security:
  - {}
  - oAuth2ClientCredentials: []

paths:
  /subscriptions:
    post:
      summary: Request the creation of an Individual ML Model Maintenance Subscription.
      operationId: CreateMlModelMaintenanceSub
      tags:
        - ML Model Maintenance Subscription (Collection)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MLModelMaintSub'
      responses:
        '201':
          description: >
            The requested Individual ML Model Maintenance Subscription is
            successfully created and a representation of the created resource is
            returned in the response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MLModelMaintSub'
          headers:
            Location:
              description: Contains the URI of the newly created resource.
              required: true
              schema:
                type: string
        '400':
          $ref: 'TS29122_CommonData.yaml#/components/responses/400'
        '401':
          $ref: 'TS29122_CommonData.yaml#/components/responses/401'
        '403':
          $ref: 'TS29122_CommonData.yaml#/components/responses/403'
        '404':
          $ref: 'TS29122_CommonData.yaml#/components/responses/404'
        '411':
          $ref: 'TS29122_CommonData.yaml#/components/responses/411'
        '413':
          $ref: 'TS29122_CommonData.yaml#/components/responses/413'
        '415':
          $ref: 'TS29122_CommonData.yaml#/components/responses/415'
        '429':
          $ref: 'TS29122_CommonData.yaml#/components/responses/429'
        '500':
          $ref: 'TS29122_CommonData.yaml#/components/responses/500'
        '503':
          $ref: 'TS29122_CommonData.yaml#/components/responses/503'
        default:
          $ref: 'TS29122_CommonData.yaml#/components/responses/default'
      callbacks:
        myNotification:
          '{$request.body#/notifUri}': 
            post:
              summary: Notifies the service consumer on the ML Model Maintenance.
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/MLModelMaintNotif'
              responses:
                '204':
                  description: The notification is successfully received.
                '307':
                  $ref: 'TS29122_CommonData.yaml#/components/responses/307'
                '308':
                  $ref: 'TS29122_CommonData.yaml#/components/responses/308'
                '400':
                  $ref: 'TS29122_CommonData.yaml#/components/responses/400'
                '401':
                  $ref: 'TS29122_CommonData.yaml#/components/responses/401'
                '403':
                  $ref: 'TS29122_CommonData.yaml#/components/responses/403'
                '404':
                  $ref: 'TS29122_CommonData.yaml#/components/responses/404'
                '411':
                  $ref: 'TS29122_CommonData.yaml#/components/responses/411'
                '413':
                  $ref: 'TS29122_CommonData.yaml#/components/responses/413'
                '415':
                  $ref: 'TS29122_CommonData.yaml#/components/responses/415'
                '429':
                  $ref: 'TS29122_CommonData.yaml#/components/responses/429'
                '500':
                  $ref: 'TS29122_CommonData.yaml#/components/responses/500'
                '503':
                  $ref: 'TS29122_CommonData.yaml#/components/responses/503'
                default:
                  $ref: 'TS29122_CommonData.yaml#/components/responses/default'

  /subscriptions/{subscriptionId}:
    parameters:
      - name: subscriptionId
        in: path
        description: >
          Represents the Individual ML Model Maintenance Subscription resource.
        required: true
        schema:
          type: string

    get:
      summary: >
       Retrieve an existing the Individual ML Model Maintenance Subscription
       resource.
      operationId: GetIndMlModelMaintenanceSub
      tags:
        - Individual ML Model Maintenance Subscription (Document)
      responses:
        '200':
          description: >
            OK. The requested Individual ML Model Maintenance Subscription
            resource shall be returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MLModelMaintSub'
        '307':
          $ref: 'TS29122_CommonData.yaml#/components/responses/307'
        '308':
          $ref: 'TS29122_CommonData.yaml#/components/responses/308'
        '400':
          $ref: 'TS29122_CommonData.yaml#/components/responses/400'
        '401':
          $ref: 'TS29122_CommonData.yaml#/components/responses/401'
        '403':
          $ref: 'TS29122_CommonData.yaml#/components/responses/403'
        '404':
          $ref: 'TS29122_CommonData.yaml#/components/responses/404'
        '406':
          $ref: 'TS29122_CommonData.yaml#/components/responses/406'
        '429':
          $ref: 'TS29122_CommonData.yaml#/components/responses/429'
        '500':
          $ref: 'TS29122_CommonData.yaml#/components/responses/500'
        '503':
          $ref: 'TS29122_CommonData.yaml#/components/responses/503'
        default:
          $ref: 'TS29122_CommonData.yaml#/components/responses/default'

    put:
      summary: >
        Request the update of an existing Individual ML Model Maintenance
        Subscription resource.
      operationId: UpdateIndMlModelMaintenanceSub
      tags:
        - Individual ML Model Maintenance Subscription (Document)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MLModelMaintSub'
      responses:
        '200':
          description: >
            OK. The Individual ML Model Maintenance Subscription resource is
            successfully updated and a representation of the updated resource shall be
            returned in the response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MLModelMaintSub'
        '204':
          description: >
            No Content. The Individual ML Model Maintenance Subscription
            resource is successfully updated and no content is returned in the
            response body.
        '307':
          $ref: 'TS29122_CommonData.yaml#/components/responses/307'
        '308':
          $ref: 'TS29122_CommonData.yaml#/components/responses/308'
        '400':
          $ref: 'TS29122_CommonData.yaml#/components/responses/400'
        '401':
          $ref: 'TS29122_CommonData.yaml#/components/responses/401'
        '403':
          $ref: 'TS29122_CommonData.yaml#/components/responses/403'
        '404':
          $ref: 'TS29122_CommonData.yaml#/components/responses/404'
        '411':
          $ref: 'TS29122_CommonData.yaml#/components/responses/411'
        '413':
          $ref: 'TS29122_CommonData.yaml#/components/responses/413'
        '415':
          $ref: 'TS29122_CommonData.yaml#/components/responses/415'
        '429':
          $ref: 'TS29122_CommonData.yaml#/components/responses/429'
        '500':
          $ref: 'TS29122_CommonData.yaml#/components/responses/500'
        '503':
          $ref: 'TS29122_CommonData.yaml#/components/responses/503'
        default:
          $ref: 'TS29122_CommonData.yaml#/components/responses/default'

    patch:
      summary: >
        Request the modification of an existing ML Model Maintenance Subscription
        resource.
      operationId: ModifyIndMlModelMaintenanceSub
      tags:
        - Individual ML Model Maintenance Subscription (Document)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MLModelMaintSubPatch'
      responses:
        '200':
          description: >
            OK. The Individual ML Model Maintenance Subscription resource is
            successfully modified and a representation of the updated resource shall
            be returned in the response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MLModelMaintSub'
        '204':
          description: >
            No Content. The Individual ML Model Maintenance Subscription
            resource is successfully modified and no content is returned in the
            response body.
        '307':
          $ref: 'TS29122_CommonData.yaml#/components/responses/307'
        '308':
          $ref: 'TS29122_CommonData.yaml#/components/responses/308'
        '400':
          $ref: 'TS29122_CommonData.yaml#/components/responses/400'
        '401':
          $ref: 'TS29122_CommonData.yaml#/components/responses/401'
        '403':
          $ref: 'TS29122_CommonData.yaml#/components/responses/403'
        '404':
          $ref: 'TS29122_CommonData.yaml#/components/responses/404'
        '411':
          $ref: 'TS29122_CommonData.yaml#/components/responses/411'
        '413':
          $ref: 'TS29122_CommonData.yaml#/components/responses/413'
        '415':
          $ref: 'TS29122_CommonData.yaml#/components/responses/415'
        '429':
          $ref: 'TS29122_CommonData.yaml#/components/responses/429'
        '500':
          $ref: 'TS29122_CommonData.yaml#/components/responses/500'
        '503':
          $ref: 'TS29122_CommonData.yaml#/components/responses/503'
        default:
          $ref: 'TS29122_CommonData.yaml#/components/responses/default'

    delete:
      summary: Remove the Individual ML Model Maintenance Subscription.
      operationId: UnsubscribeIndMlModelMaintenanceSub
      tags:
        - Individual ML Model Maintenance Subscription (Document)
      responses:
        '204':
          description: >
            The individual ML Model Maintenance Subscription resource
            matching the subscriptionId is deleted.
        '307':
          $ref: 'TS29122_CommonData.yaml#/components/responses/307'
        '308':
          $ref: 'TS29122_CommonData.yaml#/components/responses/308'
        '400':
          $ref: 'TS29122_CommonData.yaml#/components/responses/400'
        '401':
          $ref: 'TS29122_CommonData.yaml#/components/responses/401'
        '403':
          $ref: 'TS29122_CommonData.yaml#/components/responses/403'
        '404':
          $ref: 'TS29122_CommonData.yaml#/components/responses/404'
        '429':
          $ref: 'TS29122_CommonData.yaml#/components/responses/429'
        '500':
          $ref: 'TS29122_CommonData.yaml#/components/responses/500'
        '503':
          $ref: 'TS29122_CommonData.yaml#/components/responses/503'
        default:
          $ref: 'TS29122_CommonData.yaml#/components/responses/default'

components:
  securitySchemes:
    oAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: '{tokenUrl}'
          scopes: {}

  schemas:
    MLModelMaintSub:
      description: Represents the ML Model Maintenance Subscription.
      type: object
      properties:
        mlModelId:
          type: string
        mlModelRetEndPoint:
          $ref: 'TS29558_Eees_EASRegistration.yaml#/components/schemas/EndPoint'
        mlModel:
          $ref: 'TS29571_CommonData.yaml#/components/schemas/Bytes'
        mlModelMaintReq:
          $ref: '#/components/schemas/MLModelMaintReq'
        notifReq:
          $ref: '#/components/schemas/NotifReq'
        notifUri:
          $ref: 'TS29122_CommonData.yaml#/components/schemas/Uri'
        expTime:
          $ref: 'TS29122_CommonData.yaml#/components/schemas/DateTime'
        suppFeat:
          $ref: 'TS29571_CommonData.yaml#/components/schemas/SupportedFeatures'
      required:
        - mlModelId
        - mlModelMaintReq
        - notifReq
        - notifUri
      anyOf:
        - required: [mlModelRetEndPoint]
        - required: [mlModel]

    MLModelMaintSubPatch:
      description: >
        Represents the ML Model Maintenance Subscription Patch.
      type: object
      properties:
        mlModelId:
          type: string
        mlModelRetEndPoint:
          $ref: 'TS29558_Eees_EASRegistration.yaml#/components/schemas/EndPoint'
        mlModel:
          $ref: 'TS29571_CommonData.yaml#/components/schemas/Bytes'
        mlModelMaintReq:
          $ref: '#/components/schemas/MLModelMaintReq'
        notifReq:
          $ref: '#/components/schemas/NotifReq'
        notifUri:
          $ref: 'TS29122_CommonData.yaml#/components/schemas/Uri'
        expTime:
          $ref: 'TS29122_CommonData.yaml#/components/schemas/DateTime'

    MLModelMaintNotif:
      description: >
        Represents the ML Model Maintenance Notification.
      type: object
      properties:
        subId:
          type: string
        updatedMlModel:
          $ref: 'TS29571_CommonData.yaml#/components/schemas/Bytes'
        mlModelStatus:
          $ref: '#/components/schemas/MLModelStatus'
        timestamp:
          $ref: 'TS29122_CommonData.yaml#/components/schemas/DateTime'
      required:
        - subId
      anyOf:
        - required: [updatedMlModel]
        - required: [mlModelStatus]

    MLModelMaintReq:
      description: >
        Represents the ML Model Maintenance Requirements.
      type: object
      properties:
        mlModelPerfReq:
          $ref: 'TS29482_AIMLES_MLModelPerfEvaluation.yaml#/components/schemas/MLModelPerfInfo'
        mlModelEvalProfId:
          type: string
        datasetId:
          type: string
        clients:
          type: array
          items:
            type: string
          minItems: 1
        maintMode:
          $ref: '#/components/schemas/MaintMode'
      required:
        - mlModelPerfReq
        - mlModelEvalProfId
        - maintMode
      anyOf:
        - required: [datasetId]
        - required: [clients]

    MaintMode:
      description: Represents the Maintenance Mode.
      type: object
      properties:
        maintTrigger:
          $ref: '#/components/schemas/MaintTrigger'
        eventTrigger:
          type: array
          items:
            $ref: '#/components/schemas/EventTrigger'
          minItems: 1
      required:
        - maintTrigger

    MLModelStatus:
      description: Contains the status of the ML Model.
      type: object
      properties:
        updatedMlModelId:
          type: string
        mlModelVersion:
          type: string
      required:
        - updatedMlModelId
        - mlModelVersion

    NotifReq:
      description: >
        Represents the notification requirements.
      type: object
      properties:
        notifInfo:
          $ref: 'TS29523_Npcf_EventExposure.yaml#/components/schemas/ReportingInformation'
        eventTrigger:
          type: array
          items:
            $ref: '#/components/schemas/NotifEventTrigger'
          minItems: 1
      required:
        - notifInfo

#
# SIMPLE DATA TYPES
#

#
# ENUMERATIONS

    MaintTrigger:
      anyOf:
      - type: string
        enum:
           - PERIODIC
           - ON_EVENT_DETECTION
      - type: string
        description: >
          This string provides forward-compatibility with future extensions to the enumeration
          and is not used to encode content defined in the present version of this API.
      description: |
        Represents a trigger of a Maintenance.  
        Possible values are:
        - PERIODIC: Indicates the maintenance is periodically triggered.
        - ON_EVENT_DETECTION: Indicates the maintenance is triggered on event detection.

    EventTrigger:
      anyOf:
      - type: string
        enum:
           - ML_MODEL_EVENT_DEGRADATION_DETECTED
           - DATA_DRIFT_DETECTED
      - type: string
        description: >
          This string provides forward-compatibility with future extensions to the enumeration
          and is not used to encode content defined in the present version of this API.
      description: |
        Represents a trigger event.  
        Possible values are:
        - ML_MODEL_EVENT_DEGRADATION_DETECTED: Indicates a detection of a ML Model Event Degradation
          event.
        - DATA_DRIFT_DETECTED: Indicates a detection of a Data Drift event.

    NotifEventTrigger:
      anyOf:
      - type: string
        enum:
           - ML_MODEL_STATUS_CHANGED
      - type: string
        description: >
          This string provides forward-compatibility with future extensions to the enumeration
          and is not used to encode content defined in the present version of this API.
      description: |
        Represents the events that can trigger notification.  
        Possible values are:
        - ML_MODEL_STATUS_CHANGED: Indicates a status change in the ML Model.

#
