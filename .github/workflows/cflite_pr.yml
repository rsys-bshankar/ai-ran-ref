name: ClusterFuzzLite PR fuzzing

# Fuzzes the code a PR changes for a few minutes (fuzz targets: smo/fuzz/,
# build: .clusterfuzzlite/). A crash fails the job and is shown in its log.
on:
  pull_request:
    paths: ["smo/**", ".clusterfuzzlite/**", ".github/workflows/cflite_*.yml"]

permissions: read-all

concurrency:
  group: cflite-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz changed code (ClusterFuzzLite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 180
          mode: code-change
          sanitizer: address
