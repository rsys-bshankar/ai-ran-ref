name: Dependency review

# Blocks a PR that introduces a dependency with a known high/critical
# vulnerability or a copyleft-incompatible license (the repo is Apache-2.0).
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review (new vulnerable or disallowed dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later
          comment-summary-in-pr: never
