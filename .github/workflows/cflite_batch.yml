name: ClusterFuzzLite batch fuzzing

# Longer weekly run over all fuzz targets, not tied to a change.
on:
  schedule:
    - cron: "41 3 * * 0"
  workflow_dispatch:

permissions: read-all

jobs:
  fuzz:
    name: Fuzz all targets (ClusterFuzzLite batch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 1200
          mode: batch
          sanitizer: address
