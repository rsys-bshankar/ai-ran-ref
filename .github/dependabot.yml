# Version updates (security updates are already enabled in the repo settings).
# Weekly, one grouped PR per ecosystem so the review load stays small.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /smo/gui
    schedule: { interval: weekly }
    groups:
      gui-dev-tooling:
        dependency-type: development
      gui-runtime:
        dependency-type: production

  # Python: the hashed lock every container and CI job installs from
  # (smo/requirements/*.in -> *.txt, compiled with pip-compile), plus the three
  # packages that declare their own ranges in a pyproject.toml.
  - package-ecosystem: pip
    directories: [/smo/requirements, /smo/shared, /smo/sdk, /smo/gui-bff]
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }

  - package-ecosystem: maven
    directory: /smo/sdk-java
    schedule: { interval: weekly }
    groups:
      java-sdk: { patterns: ["*"] }

  # Go: the SDK has no module dependencies today (standard library only); this watches for the first one
  - package-ecosystem: gomod
    directory: /smo/sdk-go
    schedule: { interval: weekly }

  - package-ecosystem: docker
    directories: [/smo, /smo/gui, /smo/sdk-go/examples/hello-rapp, /smo/sdk-java/examples/hello-rapp]
    schedule: { interval: weekly }

  # image: lines in docker-compose.yml are a separate ecosystem
  - package-ecosystem: docker-compose
    directory: /smo
    schedule: { interval: weekly }
    ignore:
      # Tempo 3 replaces the ingester and compactor and needs a Kafka-compatible ingest path, so it is a design change, not a version bump
      # (OPEN_ITEMS.md OBS-3.9). Minor and patch updates of 2.x still arrive.
      - dependency-name: "grafana/tempo"
        update-types: ["version-update:semver-major"]
