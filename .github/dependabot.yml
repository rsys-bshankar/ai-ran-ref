# Version updates (security updates are already enabled in the repo settings).
# Weekly, one grouped PR per ecosystem so the review load stays small.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /smo/gui
    schedule: { interval: weekly }
    groups:
      gui-dev-tooling:
        dependency-type: development
      gui-runtime:
        dependency-type: production

  # Python: the hashed lock every container and CI job installs from
  # (smo/requirements/*.in -> *.txt, compiled with pip-compile), plus the three
  # packages that declare their own ranges in a pyproject.toml.
  - package-ecosystem: pip
    directories: [/smo/requirements, /smo/shared, /smo/sdk, /smo/gui-bff]
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }

  - package-ecosystem: docker
    directories: [/smo, /smo/gui]
    schedule: { interval: weekly }

  # image: lines in docker-compose.yml are a separate ecosystem
  - package-ecosystem: docker-compose
    directory: /smo
    schedule: { interval: weekly }
