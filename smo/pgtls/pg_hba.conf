# Only TLS from the network (docker-compose.pgtls.yml; the chart's postgres.tls.enabled renders the same rules). The unix socket is for the container's own
# tools (pg_isready, the image's init scripts), which are inside the trust boundary. scripts/pg_tls_check.py proves that a plain connection is refused.
local   all   all                    trust
hostssl all   all   all              scram-sha-256
host    all   all   all              reject
