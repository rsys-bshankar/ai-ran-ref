# Fluent Bit for docker compose (`--profile logging`, PR-OBS-6): reads every container's json-file log, unpacks the SMO's JSON line, sends it to Loki.
# Streams are labelled by `service` and `level`; everything else (`traceId`, `correlationId`, `route`, `status`, ...) stays in the line,
# so a query selects with the labels and filters with `| json` (docs/OBSERVABILITY.md).
[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File /fluent-bit/etc/parsers.conf

[INPUT]
    Name             tail
    Path             /var/lib/docker/containers/*/*-json.log
    Parser           docker
    Tag              smo
    Read_from_Head   False
    Refresh_Interval 5
    Skip_Long_Lines  On

[FILTER]
    Name         parser
    Match        smo
    Key_Name     log
    Parser       json
    Reserve_Data On
    Preserve_Key Off

[OUTPUT]
    Name        loki
    Match       smo
    Host        loki
    Port        3100
    Labels      job=smo
    Label_Keys  $service,$level
    Line_Format json
