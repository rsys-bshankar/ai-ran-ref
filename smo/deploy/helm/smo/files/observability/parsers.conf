# Fluent Bit parsers for the SMO's container logs (PR-OBS-6).
# docker: one line of Docker's json-file driver; cri: one line of containerd / CRI-O (Kubernetes); json: the SMO's own structured log line
# (smo_shared/logconfig.py), which sits in the `log` field of either.
[PARSER]
    Name        docker
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L
    Time_Keep   On

[PARSER]
    Name        cri
    Format      regex
    Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z

[PARSER]
    Name        json
    Format      json
