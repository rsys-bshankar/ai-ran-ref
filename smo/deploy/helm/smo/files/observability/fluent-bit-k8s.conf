# Fluent Bit as a DaemonSet (observability.fluentBit, PR-OBS-6): reads this release's pods' container logs, unpacks the SMO's JSON line,
# sends it to Loki. Streams are labelled by `service` and `level`; `traceId`, `correlationId` and the rest stay in the line.
# NAMESPACE is replaced by the chart with the release's namespace, so only its pods are read.
[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File /fluent-bit/etc/parsers.conf

[INPUT]
    Name             tail
    Path             /var/log/containers/*_NAMESPACE_*.log
    Exclude_Path     /var/log/containers/fluent-bit-*
    Parser           cri
    Tag              smo
    Read_from_Head   False
    Refresh_Interval 5
    Skip_Long_Lines  On
    DB               /tmp/flb_smo.db

[FILTER]
    Name         parser
    Match        smo
    Key_Name     log
    Parser       json
    Reserve_Data On
    Preserve_Key Off

[OUTPUT]
    Name        loki
    Match       smo
    Host        loki
    Port        3100
    Labels      job=smo,namespace=NAMESPACE
    Label_Keys  $service,$level
    Line_Format json
