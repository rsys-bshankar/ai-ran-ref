# AI-RAN SMO. Install into a namespace of its own: the services are named as in docker-compose.yml (`sme`, `dme`, `postgres`, ...), because that is
# what the modules and the GUI's nginx address each other by, so one release per namespace.
#
#   helm install smo deploy/helm/smo -n smo --create-namespace
#
# By default this brings its own Postgres and generates its own secrets. To use a Postgres you run, set postgres.enabled=false and postgres.external.*,
# and create the password Secret yourself (secrets.existingSecret). See deploy/helm/smo/README.md.

image:
  registry: ghcr.io/rsys-bshankar/ai-ran-smo   # <registry>/<prefix><name>:<tag>, as the release workflow publishes them
  prefix: smo-
  tag: ""                                      # empty: the chart's appVersion
  pullPolicy: IfNotPresent
  pullSecrets: []                              # names of image pull Secrets, if the registry is private

# The database. Bundled: one Postgres pod (a StatefulSet with a volume), for a lab or a trial. For production run a managed or HA Postgres
# and point the chart at it: postgres.enabled=false and postgres.external.
postgres:
  enabled: true
  image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
  pullPolicy: IfNotPresent                     # its own: image.pullPolicy is for the SMO images (CI sets it to Never for the ones it built)
  storage: 10Gi
  storageClassName: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  external:
    host: ""
    port: 5432
    database: smo
    user: smo
    sslmode: prefer                            # disable | prefer | require | verify-full
    # Several hosts, comma separated (and a port for each, or one for all), are tried in order; with targetSessionAttrs: read-write the one that
    # accepts writes is used, so a new primary is found after a failover without a change here. A service that always points at the primary
    # (CloudNativePG's <cluster>-rw, Patroni's leader service) needs neither.
    targetSessionAttrs: ""                     # "" | read-write | any | primary | prefer-standby

# The two secrets every install needs: the database password and the enrollment secret (what makes a module an SMO module at SME, PR-SEC-14).
# By default the chart makes them (random, kept across upgrades). To bring your own, create a Secret with the keys `db-password` and
# `enrollment-secret` and name it here: the chart then never touches them.
secrets:
  existingSecret: ""

# Per-module database roles (PR-DB-2.6). A module that names a `databaseRole` below connects as `smo_<role>`, which can use its schema and the shared
# tables it is given, and nothing else, instead of as the owner. The chart makes one password per role (random, kept across upgrades) in the Secret
# `smo-role-secrets` and the migrate Job runs scripts/db_roles.py to make the roles. With `enabled: false` every module connects as the owner.
# To bring your own passwords, create a Secret with a key `db-password-<role>` for each role and name it in `existingSecret`. The bundled Postgres
# lets the owner create roles; an external one needs an owner with CREATEROLE, or the roles made by hand (the SQL is in scripts/db_roles.py).
databaseRoles:
  enabled: true
  existingSecret: ""

# PR-SEC-9.2: a NetworkPolicy on R1 Termination's port. Off by default (it needs a CNI that enforces policy, and it denies whatever it does not list).
# A NetworkPolicy works per pod and port, not per URL path, so it cannot single out /bootstrap: enabled, ONLY the pods of this release and `allowedSources`
# may reach the gateway at all. Put in `allowedSources` whoever else must call it: the rApps (their namespace and pod labels), the ingress controller's
# namespace, a Prometheus. Entries are NetworkPolicyPeers, for example
#   allowedSources:
#     - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: rapps } }
#     - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
bootstrapNetworkPolicy:
  enabled: false
  allowedSources: []

# The GUI backend's own settings, passed through as environment (GUI_JWT_SECRET, GUI_ADMIN_PASSWORD, ...). Empty values are generated by the backend
# on first start (the initial admin password is written to /data/initial-admin-password in its pod).
gui:
  env: {}

# Where each module keeps files (Onboarding's packages, the GUI backend's database). With persistence off they are emptyDirs and are lost
# when the pod goes.
persistence:
  enabled: true
  storageClassName: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  gui:                                         # the operator GUI
    host: ""
    tlsSecretName: ""                          # empty: no TLS section
  r1:                                          # R1 Termination, the gateway rApps call
    host: ""
    tlsSecretName: ""
    publicBaseUrl: ""                          # what /bootstrap advertises, e.g. https://r1.example.com (R1_PUBLIC_BASE_URL); empty: the in-cluster address
    # PR-SEC-9.2, ingress-nginx only: when non-empty (CIDRs, e.g. ["10.0.0.0/8"]) and `host` is set, a second Ingress takes the exact path /bootstrap and
    # carries `nginx.ingress.kubernetes.io/whitelist-source-range`, so only those sources reach /bootstrap through the ingress (every other path is unchanged).
    # The path is the one thing the ingress can tell apart; a NetworkPolicy cannot (bootstrapNetworkPolicy below). Empty: /bootstrap is as open as the rest.
    bootstrapAllowedSourceRanges: []

# How an rApp instance's credentials reach its workload (PR-SEC-14). `none`: rApp Management does not deliver them; an operator fetches them once from
# POST /instances/{id}/credentials. `kubernetes`: rApp Management writes them to a Secret `rapp-<instanceId>-credentials` in this namespace (the workload
# takes it with envFrom), replaces it on rotation and deletes it on terminate; nobody sees the secret. This gives the rApp Management pod (only) a service
# account whose Role can create, update and delete Secrets in this namespace, and read none.
rappCredentials:
  delivery: none

# Where the replicas of a module land (PR-HA-5). Every module's pods are spread over nodes, so one node lost takes at most its share of a module.
#   soft  prefer different nodes (topology spread, maxSkew 1, ScheduleAnyway): pods still start when there are fewer nodes than replicas (a one-node cluster, kind)
#   hard  require them (DoNotSchedule): a replica that cannot go on another node stays Pending
#   off   no constraint
# `zoneKey` adds the same rule over zones (topology.kubernetes.io/zone) when set; a cluster without that label ignores a soft one.
placement:
  mode: soft
  zoneKey: ""

# Per-module PodDisruptionBudget and HorizontalPodAutoscaler templates, off until a module runs more than one replica (PR-HA).
podDisruptionBudget:
  enabled: false
  minAvailable: 1
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# The alert and SLO burn-rate rules (PR-OBS-5, files/smo-alerts.rules.yaml) as a PrometheusRule of the Prometheus Operator. Off by default: it needs that CRD, and
# the rules assume each module is scraped as a job named after it. `labels` is what your Prometheus's ruleSelector matches (for example `release: kube-prometheus-stack`).
prometheusRule:
  enabled: false
  namespace: ""          # empty: the release's namespace
  labels: {}

# Brings the database to this release's schema (PR-OPS-3): a Job that runs on install and, as a pre-upgrade hook, before any pod of a new version
# starts. Every module waits for the schema in an init container (it never serves on an older one).
migrate:
  backoffLimit: 4
  activeDeadlineSeconds: 900
  schemaWaitSeconds: 600                       # how long a starting pod waits for the schema before it fails and is restarted

# Every pod: no capability, no privilege escalation, a read-only root filesystem (PR-SEC-13), the unprivileged user the images run as.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001                     # the volumes (Onboarding's packages, the GUI backend's /data) are made writable for this group
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile: { type: RuntimeDefault }
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }

# What every module starts from; a module below overrides what it names.
moduleDefaults:
  enabled: true
  kind: service              # service: an HTTP server on port 8000 with /live and /ready; worker: no port, a heartbeat file; static: plain TCP probe
  port: 8000
  replicas: 1
  preStopSeconds: 5          # service kind: wait this long before SIGTERM so traffic has moved away (0 turns it off); must stay under terminationGracePeriodSeconds less the server's own drain (20)
  database: true             # gets the database URL and password
  databaseRole: ""            # connects as smo_<this> with its own password instead of as the owner (databaseRoles above); a schema of its own must exist
  enrollment: true           # presents the enrollment secret to SME, so it is recorded as an SMO module
  env: {}
  podSecurityContext: null   # replaces the pod-wide one for this module
  persistence: null          # {mountPath: /srv/packages, size: 5Gi}
  scratch: null              # an emptyDir at this path, for files copied in
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

# The modules. `image` is the image name after the prefix (smo-<image>); the services are named by the key.
modules:
  r1-termination: { image: r1-termination, databaseRole: r1-termination, enrollment: false, scratch: /srv/scratch, env: { R1_KILL_SWITCH_SCHEMA: ran_nf_oam, R1_RATE_STORE: memory } }
  sme: { image: sme, databaseRole: sme }
  dme: { image: dme, databaseRole: dme }
  onboarding: { image: onboarding, databaseRole: onboarding, persistence: { mountPath: /srv/packages, size: 5Gi } }
  rapp-mgmt: { image: rapp-mgmt, databaseRole: rapp-mgmt, env: { R1_GATEWAY_URL: "http://r1-termination:8000" } }
  ran-nf-oam: { image: ran-nf-oam, databaseRole: ran-nf-oam, env: { R1_GATEWAY_URL: "http://r1-termination:8000" } }
  # the same image as a worker: the periodic work of RAN NF OAM (PR-MSG-4). Run more than one if you like.
  ran-nf-oam-worker: { image: ran-nf-oam, databaseRole: ran-nf-oam, kind: worker, env: { R1_GATEWAY_URL: "http://r1-termination:8000" } }
  mock-o1-adaptor: { image: mock-o1-adaptor, database: false, enrollment: false }
  nfo: { image: nfo, databaseRole: nfo, env: { R1_GATEWAY_URL: "http://r1-termination:8000" } }
  focom: { image: focom, databaseRole: focom }
  mlmr: { image: mlmr, databaseRole: mlmr }
  aimgf: { image: aimgf, databaseRole: aimgf, env: { R1_GATEWAY_URL: "http://r1-termination:8000" } }
  mllf: { image: mllf, database: false, env: { R1_GATEWAY_URL: "http://r1-termination:8000" } }
  ran-analytics: { image: ran-analytics, databaseRole: ran-analytics, env: { R1_GATEWAY_URL: "http://r1-termination:8000" } }
  mdaf: { image: mdaf, databaseRole: mdaf }
  intent-service: { image: intent-service, databaseRole: intent-service }
  so-smos: { image: so-smos, databaseRole: so-smos, env: { R1_GATEWAY_URL: "http://r1-termination:8000" } }
  sa-smos: { image: sa-smos, databaseRole: sa-smos, env: { R1_GATEWAY_URL: "http://r1-termination:8000" } }
  # the reference rApps: SME records them as rApps (no enrollment secret), and R1 applies the rApp role to them
  energy-saving-rapp: { image: energy-saving-rapp, databaseRole: energy-saving-rapp, enrollment: false, env: { SMO_IDENTITY_KIND: rapp, R1_GATEWAY_URL: "http://r1-termination:8000" } }
  mobility-optimization-rapp: { image: mobility-optimization-rapp, databaseRole: mobility-optimization-rapp, enrollment: false, env: { SMO_IDENTITY_KIND: rapp, R1_GATEWAY_URL: "http://r1-termination:8000" } }
  coverage-optimization-rapp: { image: coverage-optimization-rapp, databaseRole: coverage-optimization-rapp, enrollment: false, env: { SMO_IDENTITY_KIND: rapp, R1_GATEWAY_URL: "http://r1-termination:8000" } }
  traffic-steering-rapp: { image: traffic-steering-rapp, databaseRole: traffic-steering-rapp, enrollment: false, env: { SMO_IDENTITY_KIND: rapp, R1_GATEWAY_URL: "http://r1-termination:8000" } }
  # the GUI: its backend (one replica: it keeps its users in a SQLite file on a volume) and the nginx that serves the SPA
  gui-bff:
    image: gui-bff
    kind: static
    database: false
    persistence: { mountPath: /data, size: 1Gi }
    env:
      R1_URL: "http://r1-termination:8000"
      GUI_DATABASE_URL: "sqlite:////data/gui-bff.db"
      GUI_INITIAL_PASSWORD_FILE: "/data/initial-admin-password"
  # nginx runs as the image's own user (101), so the pod does not force the SMO images' uid
  gui: { image: gui, kind: static, port: 8080, database: false, enrollment: false, podSecurityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } } }
