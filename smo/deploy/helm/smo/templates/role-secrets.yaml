{{- /*
PR-DB-2.6: the password of each per-module database role, in a Secret of its own (not smo-secrets).

It is a hook resource (pre-install and pre-upgrade, ahead of the migrate Job, which mounts it): a plain resource of the release is applied after the pre-upgrade hooks, so an
upgrade from a chart that had no roles would run the migrate Job against a Secret that does not exist yet. Being a hook, Helm creates it first and does not delete it when the release
changes or is uninstalled (like the Postgres volume, it stays: a reinstall on the kept volume finds the same passwords; delete it with the volume to start over). It is made once and kept:
each run reads the existing Secret and writes the same values back. Passwords of roles added later are generated, the rest kept.
A password this release has no role for (a module the release removed, such as a1-related) is kept too: `helm rollback` to the release before runs that release's chart, which still
mounts it, and a Secret without the key leaves its pods and its migrate Job unable to start (found by .github/workflows/smo-upgrade-kind.yml).
*/}}
{{- $roles := include "smo.dbRoles" . | fromJsonArray }}
{{- if and $roles (not .Values.databaseRoles.existingSecret) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "smo-role-secrets" }}
apiVersion: v1
kind: Secret
metadata:
  name: smo-role-secrets
  labels:
    {{- include "smo.labels" (dict "root" .) | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  {{- $current := list }}
  {{- range $roles }}
  {{- $key := printf "db-password-%s" . }}
  {{- $current = append $current $key }}
  {{- $value := randAlphaNum 32 }}
  {{- if and $existing (hasKey $existing.data $key) }}
  {{- $value = index $existing.data $key | b64dec }}
  {{- end }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- if $existing }}
  {{- range $key, $value := $existing.data }}
  {{- if not (has $key $current) }}
  {{ $key }}: {{ $value | b64dec | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
