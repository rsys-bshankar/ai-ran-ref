{{- if .Values.ingress.enabled }}
{{- $labels := include "smo.labels" (dict "root" .) }}
{{- range $key, $target := dict "gui" (dict "service" "gui" "port" 8080) "r1" (dict "service" "r1-termination" "port" 8000) }}
{{- $cfg := get $.Values.ingress $key }}
{{- if $cfg.host }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $key }}
  labels:
    {{- $labels | nindent 4 }}
  {{- with $.Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $.Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $cfg.tlsSecretName }}
  tls:
    - hosts: [{{ $cfg.host | quote }}]
      secretName: {{ $cfg.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ $cfg.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $target.service }}
                port: { number: {{ $target.port }} }
{{- end }}
{{- end }}
{{- /* PR-SEC-9.2: /bootstrap through the ingress only from `ingress.r1.bootstrapAllowedSourceRanges` (ingress-nginx's whitelist-source-range). An Exact path outranks the
       Prefix `/` of the Ingress above, so every other path is unchanged. */}}
{{- with .Values.ingress.r1 }}
{{- if and .host .bootstrapAllowedSourceRanges }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: r1-bootstrap
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "nginx.ingress.kubernetes.io/whitelist-source-range" (join "," .bootstrapAllowedSourceRanges)) $.Values.ingress.annotations) | nindent 4 }}
spec:
  {{- with $.Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .tlsSecretName }}
  tls:
    - hosts: [{{ .host | quote }}]
      secretName: {{ .tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /bootstrap
            pathType: Exact
            backend:
              service:
                name: r1-termination
                port: { number: 8000 }
{{- end }}
{{- end }}
{{- end }}
