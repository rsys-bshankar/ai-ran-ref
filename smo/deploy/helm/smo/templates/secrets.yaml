{{- /*
  Renders the Secret `smo-secrets` (keys db-password and enrollment-secret) unless `secrets.existingSecret` names one the operator made. The values are
  random on the first install and are read back from the live Secret with `lookup` on every upgrade, so they do not change: the database keeps the
  password it was initialised with. `lookup` finds nothing under `helm template` and a client-side dry run, so those render fresh random values.
*/ -}}
{{- if not .Values.secrets.existingSecret }}
{{- /* Made once and kept: a later `helm upgrade` finds the Secret and reuses its values (the database keeps the password it was initialised with). */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "smo-secrets" }}
{{- $db := randAlphaNum 32 }}
{{- $enroll := randAlphaNum 40 }}
{{- if $existing }}
{{- $db = index $existing.data "db-password" | b64dec }}
{{- $enroll = index $existing.data "enrollment-secret" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: smo-secrets
  labels:
    {{- include "smo.labels" (dict "root" .) | nindent 4 }}
type: Opaque
stringData:
  db-password: {{ $db | quote }}
  enrollment-secret: {{ $enroll | quote }}
{{- end }}
