{{- if .Values.postgres.enabled }}
{{- $labels := include "smo.labels" (dict "root" .) }}
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- $labels | nindent 4 }}
    app.kubernetes.io/name: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: postgres
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
# The bundled database: one pod, one volume. A lab or trial; for production run a managed or HA Postgres (postgres.enabled=false).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- $labels | nindent 4 }}
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        {{- $labels | nindent 8 }}
        app.kubernetes.io/name: postgres
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 70           # `postgres` in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_USER, value: smo }
            - { name: POSTGRES_DB, value: smo }
            - { name: POSTGRES_PASSWORD_FILE, value: /run/secrets/db_password }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "smo"] }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "smo"] }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: pgdata, mountPath: /var/lib/postgresql }    # PostgreSQL 18+ keeps its data in a version-named subdirectory here
            - { name: run, mountPath: /var/run/postgresql }
            - { name: secrets, mountPath: /run/secrets, readOnly: true }
      volumes:
        - name: run
          emptyDir: {}
        - name: secrets
          secret:
            secretName: {{ include "smo.secretName" . }}
            defaultMode: 0444
            items:
              - { key: db-password, path: db_password }
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
{{- end }}
