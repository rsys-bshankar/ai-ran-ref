{{- if .Values.networkPolicy.enabled }}
# docker-compose.yml's `a1_mock_net`: the mock Near-RT RIC is reachable only from a1-related, and has no route out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mock-near-rt-ric-isolation
  labels:
    {{- include "smo.labels" (dict "root" .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: mock-near-rt-ric
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/name: a1-related
  egress: []
{{- end }}
