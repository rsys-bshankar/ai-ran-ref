{{- /*
  Renders, only when `rappCredentials.delivery` is "kubernetes", the ServiceAccount `rapp-mgmt`, a Role that may create, update and delete Secrets in the
  release namespace (and read none), and the RoleBinding between them. templates/modules.yaml gives the rApp Management pod (only) that service account
  and projects its token; with delivery "none" nothing here is rendered.
*/ -}}
{{- if eq .Values.rappCredentials.delivery "kubernetes" }}
{{- /* rApp Management writes each rApp instance's credentials to a Secret of its own (smo_shared/credential_delivery.py). Create cannot be limited to names, so
the Role is namespace-wide: it can create, replace and delete Secrets here, and it cannot read any (no get, list or watch), so it cannot read the smo-secrets
Secret or another instance's credentials. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rapp-mgmt
  labels:
    {{- include "smo.labels" (dict "root" .) | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rapp-mgmt-credentials
  labels:
    {{- include "smo.labels" (dict "root" .) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rapp-mgmt-credentials
  labels:
    {{- include "smo.labels" (dict "root" .) | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: rapp-mgmt-credentials }
subjects:
  - { kind: ServiceAccount, name: rapp-mgmt, namespace: {{ .Release.Namespace }} }
{{- end }}
