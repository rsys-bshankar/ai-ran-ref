# Production: an external HA Postgres, secrets you create, replicas and disruption budgets, hard node spread, autoscaling off until sized.
#   kustomize build --enable-helm deploy/gitops/overlays/prod
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
helmGlobals:
  chartHome: ../../../helm
helmCharts:
  - name: smo
    releaseName: smo
    namespace: smo
    valuesFile: values.yaml
    kubeVersion: "1.30.0"
