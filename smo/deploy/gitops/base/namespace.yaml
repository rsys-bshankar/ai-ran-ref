# The namespace every overlay of deploy/gitops installs the chart into (base/kustomization.yaml lists it). The chart wants
# a namespace of its own: its Services are named as in docker-compose.yml, so one release per namespace. deploy/external-secrets/
# assumes the name `smo` (tests_integration/test_external_secrets_example.py checks it).
apiVersion: v1
kind: Namespace
metadata:
  name: smo
  labels:
    app.kubernetes.io/part-of: smo
    # the pods run as non-root with no capability, so the restricted Pod Security level fits, except Fluent Bit (observability.fluentBit, root, hostPath), which is lab-only
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
