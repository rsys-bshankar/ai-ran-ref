# A ClusterSecretStore for HashiCorp Vault (KV version 2) read through Kubernetes authentication.
# EXAMPLE ONLY: it has NOT been applied to a cluster (README.md). Every address, mount, role and path is a placeholder.
# Needs the External Secrets Operator (CRDs external-secrets.io/v1) and, in Vault, a Kubernetes auth role bound to the
# service account named below, with read access to secret/data/smo/*. No credential is stored in this file.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: smo-vault
spec:
  provider:
    vault:
      server: https://vault.example.internal:8200
      path: secret                 # the KV v2 mount
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes    # the auth method's mount in Vault
          role: smo-external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
