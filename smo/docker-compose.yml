      <<: *db_env
      SMO_DATABASE_URL: postgresql+psycopg://smo_sa_smos@${SMO_DB_HOST:-postgres}:${SMO_DB_PORT:-5432}/smo
      SMO_DB_POOLER: ${SMO_DB_POOLER:-}
      SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password_sa-smos
      R1_GATEWAY_URL: http://r1-termination:8000

  # ---------------------------------------------------------------- operator GUI
  # Browser -> gui (nginx, the only published GUI port) -> gui-bff -> R1
  # Termination -> modules. gui-bff publishes nothing and authenticates to R1
  # with its own SME-issued OAuth2 token; neither joins a1_mock_net.
  gui-bff:
    build: { context: ., args: { MODULE: gui-bff } }
    stop_grace_period: 30s
    <<: *hardening
    secrets: [enrollment_secret]
    depends_on: [r1-termination, sme]
    environment:
      SMO_ENROLLMENT_SECRET_FILE: /run/secrets/enrollment_secret    # PR-SEC-14: what makes this an SMO module at SME
      R1_URL: http://r1-termination:8000
      GUI_DATABASE_URL: sqlite:////data/gui-bff.db
      GUI_INITIAL_PASSWORD_FILE: /data/initial-admin-password
      # Secrets come from the shell / an .env file, never from git. Unset
      # GUI_JWT_SECRET: random per boot. Unset GUI_ADMIN_PASSWORD: a random
      # admin password is generated into GUI_INITIAL_PASSWORD_FILE (0600, never
      # logged): docker compose exec gui-bff cat /data/initial-admin-password
      GUI_JWT_SECRET: ${GUI_JWT_SECRET:-}
      GUI_ADMIN_PASSWORD: ${GUI_ADMIN_PASSWORD:-}
      GUI_OPERATOR_PASSWORD: ${GUI_OPERATOR_PASSWORD:-}
      GUI_VIEWER_PASSWORD: ${GUI_VIEWER_PASSWORD:-}
      GUI_COOKIE_SECURE: ${GUI_COOKIE_SECURE:-true}
    volumes:
      - gui_bff_data:/data   # GUI users, audit log, the BFF's SME invoker credential

  # ---------------------------------------------------------------- TLS edge (profile `tls`, PR-SEC-1)
  # PR-SB-1.4: a real NETCONF-over-SSH server (Netopeer2) with one small model, for the SSH transport of ran-nf-oam.
  # Not part of the stack: `docker compose --profile netconf-lab up -d netconf-lab`. See netconf-lab/README.md. It is a third-party
  # development image and runs as root (its supervisor needs to), so it does not take the *hardening anchor; port on loopback only.
  netconf-lab:
    profiles: ["netconf-lab"]
    image: sysrepo/sysrepo-netopeer2@sha256:36cc1d841c97f118d62f775024d60fb1ce210c3bca6b32135c1a9e5a358a1cc9
    command: ["/bin/sh", "/lab/start.sh"]
    ports: ["127.0.0.1:8830:830", "127.0.0.1:6513:6513"]       # SSH, and NETCONF over TLS (PR-SB-2.5)
    volumes:
      - ./netconf-lab:/lab:ro
      - ./netconf-lab/pki:/pki                                  # the lab's throwaway CA and client certificate, written at start (git-ignored)

  # `docker compose --profile tls up -d` adds an HTTPS door in front of the GUI (:3443) and R1 Termination (:8443).
  # Run scripts/make_dev_certs.sh first. The default stack does not start it and needs no certificate.
  edge-tls:
    profiles: ["tls"]
    image: nginxinc/nginx-unprivileged:1.31-alpine@sha256:26b0bf6fbf07297983cb341998d79c831508787de26627dd2a112321b9c3a4af
    <<: *hardening
    depends_on: [r1-termination, gui, sme]
    ports: ["3443:3443", "8443:8443"]
    volumes:
      - ./edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    secrets: [tls_cert, tls_key]

  gui:
    build: { context: ./gui }
    <<: *hardening
    depends_on: [gui-bff]
    ports: ["3000:8080"]

