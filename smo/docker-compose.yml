# AI-RAN SMO — Phase 1, Docker deployment topology (SMO Design v1.3 section 4).
# One shared Postgres instance, moduleScope-partitioned (Requirements v0.1 section 3).
# Every service built from the same Dockerfile, parameterized by MODULE.
# The database password is a Compose secret, a file mounted at /run/secrets/db_password (PR-SEC-4.3): run
# scripts/init_secrets.sh once to create it. There is no default and no password in this file or in any container's
# environment; the stack does not start without the secret file (PR-DB-1).
# stop_grace_period (30 s) is longer than the Dockerfile's UVICORN_GRACEFUL_SHUTDOWN_SECONDS (20 s), so a
# stopping container finishes its in-flight requests before docker would kill it (PR-ST-6).

# Every service built from the shared Dockerfile answers GET /ready (smo_shared/health.py, PR-ST-7): 200 when its
# database and SME answer, 503 otherwise, so `docker compose ps` shows what can take traffic. The gui-bff is not
# one of them. The probe is Python because the image has no curl.
# A worker (`python -m smo_shared.worker`) has no HTTP port: it touches a file on every tick, and is unhealthy when that file is a minute old.
x-worker-probe: &worker_probe
  test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/worker-heartbeat') < 60 else 1)"]
  interval: 15s
  timeout: 5s
  retries: 4
  start_period: 30s

x-ready-probe: &ready_probe
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=4)"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 30s

# Container hardening for every service we build (PR-SEC-13): no Linux capability (a service binds port 8000 and
# needs none), and no way to gain one through a setuid binary. Postgres keeps its defaults: its entrypoint
# drops privileges itself and needs a few. The root filesystem is read-only (PR-SEC-13.2): a service writes only to /tmp
# (memory, gone on restart) and to the named volumes it mounts (/data, /srv/packages, /srv/scratch). To put files into a
# running container (the runbook's CSARs), copy them into the r1-termination volume at /srv/scratch, never into /tmp.
x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs: ["/tmp"]

# Every service that uses the database waits for it to be healthy AND for the one-shot `migrate` service to have
# finished (PR-OPS-1.5): the schema is created and upgraded by the Alembic history, never by the services.
x-wait-for-schema: &wait_for_schema
  postgres: { condition: service_healthy }
  migrate: { condition: service_completed_successfully }

# The environment every database-using service shares: where the database is, and the file its password is in.
x-db-env: &db_env
  SMO_DATABASE_URL: postgresql+psycopg://smo@${SMO_DB_HOST:-postgres}:${SMO_DB_PORT:-5432}/smo   # no password here: smo_shared/db.py adds it from the file below
  SMO_DB_POOLER: ${SMO_DB_POOLER:-}
  SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password

services:
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: smo
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password   # the official image reads the password from this file
      POSTGRES_DB: smo
    secrets: [db_password]
    # Slow-statement log (PR-DB-4.1): any statement running longer than POSTGRES_SLOW_QUERY_MS (default 500 ms)
    # is logged with its duration and text: `docker compose logs postgres | grep duration`. -1 turns it off, 0 logs all.
    command: ["postgres", "-c", "log_min_duration_statement=${POSTGRES_SLOW_QUERY_MS:-500}"]
    volumes:
      # PostgreSQL 18+ images keep data in a version-named subdirectory of
      # /var/lib/postgresql, so the volume mounts there (not at .../data).
      # A volume left by a 16 stack is not readable by 18: `docker compose down -v`
      # (demo data) or pg_dump/pg_restore across the upgrade.
      - smo_pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smo"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Connection pooler (PR-DB-5.1), a profile: `SMO_DB_HOST=pgbouncer SMO_DB_POOLER=transaction docker compose --profile pooler up -d`.
  # Every service then connects to pgbouncer:6432 instead of postgres:5432 (SMO_DB_PORT=6432). The one-shot `migrate` service always goes direct: DDL and advisory
  # locks want a session. SMO_DB_POOLER makes the services leave off what transaction pooling cannot carry (README, "Connection pooling and pool sizing").
  pgbouncer:
    profiles: ["pooler"]
    build: { context: ./pgbouncer }
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    secrets: [db_password, db_password_onboarding, db_password_mlmr, db_password_ran-analytics, db_password_so-smos, db_password_sa-smos, db_password_intent-service, db_password_mdaf, db_password_energy-saving-rapp, db_password_mobility-optimization-rapp, db_password_coverage-optimization-rapp, db_password_traffic-steering-rapp, db_password_a1-related, db_password_aimgf, db_password_dme, db_password_focom, db_password_nfo, db_password_r1-termination, db_password_ran-nf-oam, db_password_rapp-mgmt, db_password_sme]
    environment:
      PGBOUNCER_POOL_SIZE: ${PGBOUNCER_POOL_SIZE:-20}
      PGBOUNCER_MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-1000}
    depends_on: { migrate: { condition: service_completed_successfully } }
    ports: ["127.0.0.1:6432:6432"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Brings the database to the schema of this release, then exits (PR-OPS-1.5, docs/adr/0001-schema-migrations.md): an
  # empty database gets the baseline and every revision after it, a database made from 001_init.sql by an earlier
  # stack is stamped and upgraded, an up-to-date one is left alone. The services wait for it to finish; if it fails
  # they do not start, and `docker compose logs migrate` says why. The image is any of the service images (all carry
  # the migrations); this one is the R1 Termination build, so no extra image layer is built.
  migrate:
    build: { context: ., args: { MODULE: r1-termination } }
    # the schema, then the per-module roles (PR-DB-2.6): one role for every module whose password file is mounted here, and none for one without
    command: ["sh", "-c", "python /srv/scripts/migrate.py && python /srv/scripts/db_roles.py"]
    restart: "no"
    stop_grace_period: 30s
    secrets: [db_password, db_password_onboarding, db_password_mlmr, db_password_ran-analytics, db_password_so-smos, db_password_sa-smos, db_password_intent-service, db_password_mdaf, db_password_energy-saving-rapp, db_password_mobility-optimization-rapp, db_password_coverage-optimization-rapp, db_password_traffic-steering-rapp, db_password_a1-related, db_password_aimgf, db_password_dme, db_password_focom, db_password_nfo, db_password_r1-termination, db_password_ran-nf-oam, db_password_rapp-mgmt, db_password_sme]
    <<: *hardening
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      SMO_DATABASE_URL: postgresql+psycopg://smo@postgres:5432/smo
      SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password

  r1-termination:
    build: { context: ., args: { MODULE: r1-termination } }
    stop_grace_period: 30s
    secrets: [db_password_r1-termination]    # PR-SEC-11: the gateway adds a row to the audit chain for every authenticated change (it keeps no other state)
    <<: *hardening
    healthcheck: *ready_probe
    depends_on: *wait_for_schema
    ports: ["8080:8000"]
    volumes:
      - smo_scratch:/srv/scratch   # where the runbook copies the rApp CSARs it serves (`docker compose cp ... r1-termination:/srv/scratch/`)
    environment:
      <<: *db_env
      SMO_DATABASE_URL: postgresql+psycopg://smo_r1_termination@${SMO_DB_HOST:-postgres}:${SMO_DB_PORT:-5432}/smo
      SMO_DB_POOLER: ${SMO_DB_POOLER:-}
      SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password_r1-termination
      R1_KILL_SWITCH_SCHEMA: ran_nf_oam    # the gateway reads RAN NF OAM's rapp_kill, read-only (migrations/db_roles.json)
      R1_AUDIT: ${R1_AUDIT:-on}    # off: no audit rows (the gateway then needs no database)
      # PR-SEC-1.6: unset, /bootstrap names SME on the compose network; set to the HTTPS door (https://localhost:8443 with the tls
      # profile) and it names that address instead, so a consumer that only reaches the edge can complete the flow.
      R1_PUBLIC_BASE_URL: ${R1_PUBLIC_BASE_URL:-}
      SME_URL: http://sme:8000
      DME_URL: http://dme:8000
      ONBOARDING_URL: http://onboarding:8000
      RAPP_MGMT_URL: http://rapp-mgmt:8000
      RAN_NF_OAM_URL: http://ran-nf-oam:8000
      A1_RELATED_URL: http://a1-related:8000
      NFO_URL: http://nfo:8000
      FOCOM_URL: http://focom:8000
      AIMGF_URL: http://aimgf:8000
      MLMR_URL: http://mlmr:8000
      MLLF_URL: http://mllf:8000
      RAN_ANALYTICS_URL: http://ran-analytics:8000
      MDAF_URL: http://mdaf:8000
      INTENT_SERVICE_URL: http://intent-service:8000
      SO_SMOS_URL: http://so-smos:8000
      SA_SMOS_URL: http://sa-smos:8000
      ENERGY_SAVING_RAPP_URL: http://energy-saving-rapp:8000
      MOBILITY_OPTIMIZATION_RAPP_URL: http://mobility-optimization-rapp:8000
      COVERAGE_OPTIMIZATION_RAPP_URL: http://coverage-optimization-rapp:8000
      TRAFFIC_STEERING_RAPP_URL: http://traffic-steering-rapp:8000

  sme:
    build: { context: ., args: { MODULE: sme } }
    stop_grace_period: 30s
    secrets: [db_password_sme, enrollment_secret]
    <<: *hardening
    healthcheck: *ready_probe
    depends_on: *wait_for_schema
    environment:
      SMO_ENROLLMENT_SECRET_FILE: /run/secrets/enrollment_secret    # PR-SEC-14: what makes this an SMO module at SME
      <<: *db_env
      SMO_DATABASE_URL: postgresql+psycopg://smo_sme@${SMO_DB_HOST:-postgres}:${SMO_DB_PORT:-5432}/smo
      SMO_DB_POOLER: ${SMO_DB_POOLER:-}
      SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password_sme
      # PR-SEC-1.6: a client assertion's `aud` is the token endpoint /bootstrap advertised; behind the HTTPS door that is
      # <R1_PUBLIC_BASE_URL>/sme/oauth2/token. Unset (empty), SME uses its own address on the compose network.
      SME_TOKEN_AUDIENCE: ${R1_PUBLIC_BASE_URL:+${R1_PUBLIC_BASE_URL}/sme/oauth2/token}

  dme:
    build: { context: ., args: { MODULE: dme } }
    stop_grace_period: 30s
    secrets: [db_password_dme, enrollment_secret]
    <<: *hardening
    healthcheck: *ready_probe
    depends_on: *wait_for_schema
    environment:
      SMO_ENROLLMENT_SECRET_FILE: /run/secrets/enrollment_secret    # PR-SEC-14: what makes this an SMO module at SME
      <<: *db_env
      SMO_DATABASE_URL: postgresql+psycopg://smo_dme@${SMO_DB_HOST:-postgres}:${SMO_DB_PORT:-5432}/smo
      SMO_DB_POOLER: ${SMO_DB_POOLER:-}
      SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password_dme

  onboarding:
    build: { context: ., args: { MODULE: onboarding } }
    stop_grace_period: 30s
    secrets: [db_password_onboarding, enrollment_secret]    # not db_password: it connects as its own role (PR-DB-2.6), which scripts/db_roles.py makes
    <<: *hardening
    healthcheck: *ready_probe
    depends_on: *wait_for_schema
    environment:
      SMO_ENROLLMENT_SECRET_FILE: /run/secrets/enrollment_secret    # PR-SEC-14: what makes this an SMO module at SME
      <<: *db_env
      SMO_DATABASE_URL: postgresql+psycopg://smo_onboarding@${SMO_DB_HOST:-postgres}:${SMO_DB_PORT:-5432}/smo    # the role can use schema `onboarding` and the shared tables it is given, nothing else
      SMO_DB_POOLER: ${SMO_DB_POOLER:-}
      SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password_onboarding
    volumes:
      - smo_packages:/srv/packages   # FileSystem-aaS, SMO Design v1.3 section 3.4

  rapp-mgmt:
    build: { context: ., args: { MODULE: rapp-mgmt } }
    stop_grace_period: 30s
    secrets: [db_password_rapp-mgmt, enrollment_secret]
    <<: *hardening
    healthcheck: *ready_probe
    depends_on: *wait_for_schema
    environment:
      SMO_ENROLLMENT_SECRET_FILE: /run/secrets/enrollment_secret    # PR-SEC-14: what makes this an SMO module at SME
      <<: *db_env
      SMO_DATABASE_URL: postgresql+psycopg://smo_rapp_mgmt@${SMO_DB_HOST:-postgres}:${SMO_DB_PORT:-5432}/smo
      SMO_DB_POOLER: ${SMO_DB_POOLER:-}
      SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password_rapp-mgmt
      R1_GATEWAY_URL: http://r1-termination:8000

  ran-nf-oam:
    build: { context: ., args: { MODULE: ran-nf-oam } }
    stop_grace_period: 30s
    secrets: [db_password_ran-nf-oam, enrollment_secret]
    <<: *hardening
    healthcheck: *ready_probe
    depends_on: *wait_for_schema
    environment:
      SMO_ENROLLMENT_SECRET_FILE: /run/secrets/enrollment_secret    # PR-SEC-14: what makes this an SMO module at SME
      <<: *db_env
      SMO_DATABASE_URL: postgresql+psycopg://smo_ran_nf_oam@${SMO_DB_HOST:-postgres}:${SMO_DB_PORT:-5432}/smo
      SMO_DB_POOLER: ${SMO_DB_POOLER:-}
      SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password_ran-nf-oam
      R1_GATEWAY_URL: http://r1-termination:8000
      SAFEGUARD_REFUSAL_RETENTION_DAYS: ${SAFEGUARD_REFUSAL_RETENTION_DAYS:-0}

  # PR-MSG-4: the same image, run as a worker. It does RAN NF OAM's periodic work (the wave advance of staged CM jobs, KPI schedules,
  # the refusal purge; ran-nf-oam/app/tasks.py), so no request process ever runs a timer. Run as many as you like: a task runs at most
  # once per interval across all of them, and a worker that dies frees its tasks for another.
  ran-nf-oam-worker:
    build: { context: ., args: { MODULE: ran-nf-oam } }
    command: ["python", "-m", "smo_shared.worker"]
    stop_grace_period: 30s
    secrets: [db_password_ran-nf-oam, enrollment_secret]
    <<: *hardening
    healthcheck: *worker_probe
    depends_on: *wait_for_schema
    environment:
      SMO_ENROLLMENT_SECRET_FILE: /run/secrets/enrollment_secret    # PR-SEC-14: the worker is the same SMO module (one identity, ST-4)
      <<: *db_env
      SMO_DATABASE_URL: postgresql+psycopg://smo_ran_nf_oam@${SMO_DB_HOST:-postgres}:${SMO_DB_PORT:-5432}/smo
      SMO_DB_POOLER: ${SMO_DB_POOLER:-}
      SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password_ran-nf-oam
      R1_GATEWAY_URL: http://r1-termination:8000
      SAFEGUARD_REFUSAL_RETENTION_DAYS: ${SAFEGUARD_REFUSAL_RETENTION_DAYS:-0}

  mock-o1-adaptor:
    build: { context: ., args: { MODULE: mock-o1-adaptor } }
    stop_grace_period: 30s
    <<: *hardening
    healthcheck: *ready_probe
    # No isolated network segment — unlike mock-near-rt-ric (RT-7, SMO
    # Design v1.3 section 3.9), nothing in this build's own design
    # documents an equivalent O1-adaptor isolation requirement. A real
    # ManagedElement's own adaptor_uri (o1_adaptor_endpoint.adaptor_uri)
    # points at http://mock-o1-adaptor:8000/edit-config for a NETCONF ME,
    # or at the RESTCONF root http://mock-o1-adaptor:8000/restconf for a
    # RESTCONF ME (HISTORY.md OI-1-cm-sync-restconf).

  # Wave 10.1: the EnergySaving reference rApp (samples/energy-saving-rapp)
  # — an R1 consumer of the platform, deployed beside it for the demo
  # (DEMO_RUNBOOK.md §24, Demo 00–11). It reaches every SMO service only
  # through R1 Termination, and is reached by the GUI the same way.
  energy-saving-rapp:
    build: { context: ., args: { MODULE: samples/energy-saving-rapp } }
    stop_grace_period: 30s
    secrets: [db_password_energy-saving-rapp]
    <<: *hardening
    healthcheck: *ready_probe
    depends_on: *wait_for_schema
    environment:
      SMO_IDENTITY_KIND: rapp        # PR-SEC-14: an rApp: no enrollment secret, so SME records it as one and R1 applies the rApp role
      <<: *db_env
      SMO_DATABASE_URL: postgresql+psycopg://smo_energy_saving_rapp@${SMO_DB_HOST:-postgres}:${SMO_DB_PORT:-5432}/smo
      SMO_DB_POOLER: ${SMO_DB_POOLER:-}
      SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password_energy-saving-rapp
      R1_GATEWAY_URL: http://r1-termination:8000

  # Wave 10.2: the Mobility Optimization reference rApp
  # (samples/mobility-optimization-rapp) — R1-only, like energy-saving-rapp.
  mobility-optimization-rapp:
    build: { context: ., args: { MODULE: samples/mobility-optimization-rapp } }
    stop_grace_period: 30s
    secrets: [db_password_mobility-optimization-rapp]
    <<: *hardening
    healthcheck: *ready_probe
    depends_on: *wait_for_schema
    environment:
      SMO_IDENTITY_KIND: rapp        # PR-SEC-14: an rApp: no enrollment secret, so SME records it as one and R1 applies the rApp role
      <<: *db_env
      SMO_DATABASE_URL: postgresql+psycopg://smo_mobility_optimization_rapp@${SMO_DB_HOST:-postgres}:${SMO_DB_PORT:-5432}/smo
      SMO_DB_POOLER: ${SMO_DB_POOLER:-}
      SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password_mobility-optimization-rapp
      R1_GATEWAY_URL: http://r1-termination:8000

  # Wave 10.3: the Coverage Optimization reference rApp
  # (samples/coverage-optimization-rapp) — R1-only, like energy-saving-rapp.
  coverage-optimization-rapp:
    build: { context: ., args: { MODULE: samples/coverage-optimization-rapp } }
    stop_grace_period: 30s
    secrets: [db_password_coverage-optimization-rapp]
    <<: *hardening
    healthcheck: *ready_probe
    depends_on: *wait_for_schema
    environment:
      SMO_IDENTITY_KIND: rapp        # PR-SEC-14: an rApp: no enrollment secret, so SME records it as one and R1 applies the rApp role
      <<: *db_env
      SMO_DATABASE_URL: postgresql+psycopg://smo_coverage_optimization_rapp@${SMO_DB_HOST:-postgres}:${SMO_DB_PORT:-5432}/smo
      SMO_DB_POOLER: ${SMO_DB_POOLER:-}
      SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password_coverage-optimization-rapp
      R1_GATEWAY_URL: http://r1-termination:8000

  # Wave 10.4: the Traffic Steering reference rApp
  # (samples/traffic-steering-rapp) — R1-only, like energy-saving-rapp.
  traffic-steering-rapp:
    build: { context: ., args: { MODULE: samples/traffic-steering-rapp } }
    stop_grace_period: 30s
    secrets: [db_password_traffic-steering-rapp]
    <<: *hardening
    healthcheck: *ready_probe
    depends_on: *wait_for_schema
    environment:
      SMO_IDENTITY_KIND: rapp        # PR-SEC-14: an rApp: no enrollment secret, so SME records it as one and R1 applies the rApp role
      <<: *db_env
      SMO_DATABASE_URL: postgresql+psycopg://smo_traffic_steering_rapp@${SMO_DB_HOST:-postgres}:${SMO_DB_PORT:-5432}/smo
      SMO_DB_POOLER: ${SMO_DB_POOLER:-}
      SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password_traffic-steering-rapp
      R1_GATEWAY_URL: http://r1-termination:8000

  a1-related:
    build: { context: ., args: { MODULE: a1-related } }
    stop_grace_period: 30s
    secrets: [db_password_a1-related, enrollment_secret]
    <<: *hardening
    healthcheck: *ready_probe
    depends_on: *wait_for_schema
    networks: [default, a1_mock_net]
    environment:
      SMO_ENROLLMENT_SECRET_FILE: /run/secrets/enrollment_secret    # PR-SEC-14: what makes this an SMO module at SME
      <<: *db_env
      SMO_DATABASE_URL: postgresql+psycopg://smo_a1_related@${SMO_DB_HOST:-postgres}:${SMO_DB_PORT:-5432}/smo
      SMO_DB_POOLER: ${SMO_DB_POOLER:-}
      SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password_a1-related
      R1_GATEWAY_URL: http://r1-termination:8000
      MOCK_NEAR_RT_RIC_URL: http://mock-near-rt-ric:8000

  mock-near-rt-ric:
    build: { context: ., args: { MODULE: mock-near-rt-ric } }
    stop_grace_period: 30s
    <<: *hardening
    healthcheck: *ready_probe
    networks: [a1_mock_net]   # isolated, non-routable dev segment — ONLY a1-related can reach it,
                              # no published ports, not on `default` (closes RT-7, SMO Design v1.3 section 3.9)

  nfo:
    build: { context: ., args: { MODULE: nfo } }
    stop_grace_period: 30s
    secrets: [db_password_nfo, enrollment_secret]
    <<: *hardening
    healthcheck: *ready_probe
    depends_on: *wait_for_schema
    environment:
      SMO_ENROLLMENT_SECRET_FILE: /run/secrets/enrollment_secret    # PR-SEC-14: what makes this an SMO module at SME
      <<: *db_env
      SMO_DATABASE_URL: postgresql+psycopg://smo_nfo@${SMO_DB_HOST:-postgres}:${SMO_DB_PORT:-5432}/smo
      SMO_DB_POOLER: ${SMO_DB_POOLER:-}
      SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password_nfo
      R1_GATEWAY_URL: http://r1-termination:8000
    # No `privileged: true` and no Docker socket (PR-SEC-13): NFO never started a container (it runs no
    # `docker run`, nfo/README.md), and either one is root on the host. The Docker bridge of SMO Design v1.3
    # section 3.7 has to arrive as a narrow, separately-run component (a socket proxy that allows a few API calls,
    # or the Kubernetes API), not as this service holding the socket.

  focom:
    build: { context: ., args: { MODULE: focom } }
    stop_grace_period: 30s
    secrets: [db_password_focom, enrollment_secret]
    <<: *hardening
    healthcheck: *ready_probe
    depends_on: *wait_for_schema
    environment:
      SMO_ENROLLMENT_SECRET_FILE: /run/secrets/enrollment_secret    # PR-SEC-14: what makes this an SMO module at SME
      <<: *db_env
      SMO_DATABASE_URL: postgresql+psycopg://smo_focom@${SMO_DB_HOST:-postgres}:${SMO_DB_PORT:-5432}/smo
      SMO_DB_POOLER: ${SMO_DB_POOLER:-}
      SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password_focom

  mlmr:
    build: { context: ., args: { MODULE: mlmr } }
    stop_grace_period: 30s
