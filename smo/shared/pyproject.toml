[project]
name = "smo-shared"
version = "0.1.0"
description = "Shared library for the AI-RAN SMO Phase 1 reference implementation"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "fastapi>=0.110",
    "pydantic>=2.6",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["smo_shared*"]
