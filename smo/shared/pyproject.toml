[project]
name = "smo-shared"
version = "0.1.0"
description = "Shared library for the AI-RAN SMO Phase 1 reference implementation"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "prometheus-client>=0.20",
    "psycopg[binary]>=3.1",
    "fastapi>=0.110",
    "pydantic>=2.6",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
# Distributed traces (smo_shared/tracing.py): without these only W3C traceparent propagation runs. Pinned and hashed in requirements/tracing.txt.
tracing = [
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["smo_shared*"]

[tool.mutmut]
source_paths = ["smo_shared"]
only_mutate = ["smo_shared/pagination.py", "smo_shared/ratelimit.py", "smo_shared/timeutil.py", "smo_shared/roles.py"]
pytest_add_cli_args_test_selection = ["tests/", "../../r1-termination/tests/test_roles.py"]
