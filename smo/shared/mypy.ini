# Type check of the shared library (PR-V-2b): `cd smo/shared && mypy smo_shared` (the `lint` job runs it with the runtime requirements installed).
# check_untyped_defs: the bodies of functions without annotations are checked too (most of the library has none), which is where the findings were.
# ignore_missing_imports: a package without type information (prometheus_client, jsonschema, paramiko...) is `Any`, not an error.
# The modules are next, one at a time; shared/ comes first because every module imports it.
[mypy]
python_version = 3.11
files = smo_shared
check_untyped_defs = True
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
