[project]
name = "smo-sdk"
version = "0.1.0"
description = "AI Runtime SDK — a thin rApp-facing client over R1 Termination, wrapping smo_shared.r1_client.R1Client"
requires-python = ">=3.11"
dependencies = [
    "smo-shared",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["smo_sdk*"]
