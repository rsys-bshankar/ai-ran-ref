# SMO Operator GUI — serves the built SPA and reverse-proxies /api to the BFF.
# The browser only ever talks to this origin: never to R1 Termination or a
# module port (no CORS anywhere, and no way around the BFF's role checks).

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # BFF: its own responses carry their own security headers (CSP 'none' etc).
    location /api/ {
        proxy_pass http://gui-bff:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 50m;   # AI/ML model artifact uploads
    }

    # Hashed build output: cache forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Client-side routes all resolve to the SPA shell, which is never cached.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
