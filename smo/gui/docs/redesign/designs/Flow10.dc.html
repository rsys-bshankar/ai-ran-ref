<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lifecycle flow 10 — AI-RAN SMO</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="console.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:var(--ground)}
a{color:var(--volt-text)}a:hover{filter:brightness(1.1)}
</style>
</helmet>
<div data-theme="{{P.theme}}" data-accent="{{P.accent}}" style="zoom: {{P.zoom}}; background: var(--ground); min-height: 1460px;">
  <dc-import name="Flows" flow="10" hint-size="100%,1460px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1460}}'>
class Component extends DCLogic {
  renderVals() {
    const P = (() => { let p = {}; try { p = JSON.parse(localStorage.getItem('smo.prefs') || '{}') || {}; } catch (e) {} const sys = (typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark'; return { theme: p.theme === 'system' ? sys : (p.theme || 'dark'), accent: p.accent || 'volt', zoom: ({ s: '0.9', m: '1', l: '1.12', xl: '1.25' })[p.size || 'm'] || '1' }; })(); return { P, }; }
}
</script>
</body>
</html>
