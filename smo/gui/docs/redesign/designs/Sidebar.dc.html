<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="console.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:var(--volt-text)}a:hover{filter:brightness(1.1)}
</style>
</helmet>
<nav aria-label="Main" style="flex: 0 0 248px; width: 248px; min-height: 100%; background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: var(--text);">
  <div style="display: flex; align-items: center; gap: 12px; padding: 20px 18px 18px;">
    <img src="/_blob/d353a95fc4ce791ad17c0bc964c883f5" alt="Radisys" width="36" height="36" style="width: 36px; height: 36px; border-radius: 9px; display: block;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <strong style="font-family: 'Space Grotesk', sans-serif; font-size: 16px; letter-spacing: 0.02em;">AI-RAN SMO</strong>
      <span style="font-size: 12px; color: var(--muted);">Radisys · Operator Console</span>
    </div>
  </div>
  <div style="padding: 0 12px 6px;">
    <div style="display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface);">
      <span class="dot d-ok"></span>
      <span style="font-size: 12.5px; flex: 1;">prod-eu · SMO 21/21</span>
      <span class="mono" style="font-size: 11px; color: var(--muted);">4.1k DUs</span>
    </div>
  </div>
  <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
    <div style="padding: 14px 12px 2px; display: flex; flex-direction: column; gap: 2px;">
      <div class="eyebrow" style="padding: 0 10px 6px; font-size: 10.5px;">{{g.title}}</div>
      <sc-for list="{{g.items}}" as="it" hint-placeholder-count="4">
        <a href="{{it.href}}" style="{{it.style}}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.d}}"></path></svg>
          <span style="flex: 1;">{{it.label}}</span>
          <sc-if value="{{it.hasBadge}}" hint-placeholder-val="{{false}}">
            <span style="{{it.badgeStyle}}">{{it.badge}}</span>
          </sc-if>
        </a>
      </sc-for>
    </div>
  </sc-for>
  <div style="flex: 1;"></div>
  <div style="margin: 16px 12px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; display: flex; align-items: center; gap: 10px; background: var(--surface);">
    <span class="av">A</span>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
      <strong style="font-size: 13px;">admin</strong>
      <span class="mono" style="font-size: 10.5px; color: var(--bad); letter-spacing: 0.08em;">ADMIN · MFA ON</span>
    </div>
    <button class="btn btn-ghost btn-icon btn-sm" aria-label="Sign out"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"></path></svg></button>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","flows","rapps","aiml","intents","approvals","decisions","safeguards","alarms","kpis","infra","data","topology","config","software","prefs","security","admin"],"default":"dashboard"},"$preview":{"width":248,"height":1200}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'dashboard';
    const I = {
      dashboard: 'M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z',
      flows: 'M4 7h11M11 3l4 4-4 4M20 17H9M13 13l-4 4 4 4',
      rapps: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM16.5 13v7M13 16.5h7',
      aiml: 'M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12L4 7.5',
      intents: 'M12 3v18M8 21h8M5 7h14M5 7l-2.5 6h5zM19 7l-2.5 6h5z',
      approvals: 'M9 11l3 3 8-8M20 12v7a1 1 0 01-1 1H5a1 1 0 01-1-1V5a1 1 0 011-1h10',
      decisions: 'M6 3h12v18H6zM9 7h6M9 11h6M9 15h3',
      safeguards: 'M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6zM9 12l2 2 4-4',
      alarms: 'M6 16v-5a6 6 0 0112 0v5l2 2H4zM10 21h4',
      kpis: 'M3 17l5-6 4 3 5-7 4 4M3 21h18',
      infra: 'M4 4h16v6H4zM4 14h16v6H4zM8 7h.01M8 17h.01',
      data: 'M7 4v16M4 17l3 3 3-3M17 20V4M14 7l3-3 3 3',
      security: 'M6 11h12v9H6zM9 11V8a3 3 0 016 0v3',
      admin: 'M12 9a3 3 0 100 6 3 3 0 000-6zM12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1',
      topology: 'M5 5h4v4H5zM15 5h4v4h-4zM10 15h4v4h-4zM7 9l4 6M17 9l-4 6M9 7h6',
      config: 'M4 7h9M17 7h3M4 17h3M11 17h9M15 5v4M9 15v4',

      prefs: 'M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0M14 4v4M8 10v4M16 16v4'
    };
    const item = (id, label, href, badge, tone) => {
      const on = id === active;
      const tones = { bad: 'background:var(--bad);color:var(--on-sev);', warn: 'background:var(--warn);color:var(--on-sev);', mute: 'background:var(--raised);color:var(--muted);' };
      return {
        label, href, d: I[id], hasBadge: !!badge, badge: badge || '',
        badgeStyle: 'font:700 10.5px/1 JetBrains Mono, monospace;padding:3px 7px;border-radius:999px;' + (tones[tone] || tones.mute),
        style: 'display:flex;align-items:center;gap:11px;min-height:38px;padding:0 10px;border-radius:8px;font-size:13.5px;text-decoration:none;' +
          (on ? 'background:var(--volt-soft);color:var(--volt-text);font-weight:600;box-shadow:inset 3px 0 0 var(--volt);' : 'color:var(--text-2);')
      };
    };
    return {
      groups: [
        { title: 'Overview', items: [item('dashboard', 'Dashboard', 'Main.dc.html'), item('flows', 'Lifecycle flows', 'Flows.dc.html')] },
        { title: 'Automation', items: [
          item('rapps', 'rApps', 'Rapps.dc.html', '487'),
          item('approvals', 'Approvals', 'Approvals.dc.html', '18', 'warn'),
          item('decisions', 'Decisions', 'Decisions.dc.html'),
          item('safeguards', 'Safeguards', 'Safeguards.dc.html'),
          item('aiml', 'AI/ML', 'Aiml.dc.html'),
          item('intents', 'Intents', 'Intents.dc.html')
        ] },
        { title: 'Network', items: [
          item('alarms', 'Alarms', 'Alarms.dc.html', '1.2k', 'bad'),
          item('kpis', 'KPIs & Assurance', 'Kpis.dc.html'),
          item('topology', 'RAN topology', 'Topology.dc.html'),
          item('config', 'Configuration', 'Configuration.dc.html', '1', 'warn'),
          item('software', 'Software', 'Software.dc.html', '1', 'bad'),
          item('infra', 'Infrastructure', 'Infrastructure.dc.html'),
          item('data', 'Data & Exposure', 'Data.dc.html')
        ] },
        { title: 'Account', items: [item('prefs', 'Preferences', 'Preferences.dc.html'), item('security', 'Account security', 'Security.dc.html'), item('admin', 'Admin', 'Admin.dc.html')] }
      ]
    };
  }
}
</script>
</body>
</html>
