description: >
  CoverageOptimization_rApp — the Wave 10.3 reference rApp
  (docs/ROADMAP.md Wave 10.3). A Non-RT RIC rApp that
  learns how weak coverage, overshoot and pilot pollution respond to tilt and
  transmit power, and tunes a cluster of cells jointly
  (CommonBeamformingFunction.digitalTilt, NRSectorCarrier.configuredMaxTxPower)
  through O1. No A1, Near-RT RIC, xApps or E2.

