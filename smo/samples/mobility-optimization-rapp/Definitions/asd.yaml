tosca_definitions_version: tosca_simple_yaml_1_3

description: >
  MobilityOptimization_rApp — the Wave 10.2 reference rApp
  (docs/ROADMAP.md Wave 10.2). A Non-RT RIC rApp that
  classifies handover failures per neighbour relation (too-late / too-early /
  wrong-cell / ping-pong) from O1 PM data and tunes each relation's Cell
  Individual Offset (NRCellRelation.cellIndividualOffset) through O1, within
  DMRO bounds it imposes on the gNB. No A1, Near-RT RIC, xApps or E2.

