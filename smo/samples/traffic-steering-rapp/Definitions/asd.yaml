tosca_definitions_version: tosca_simple_yaml_1_3

description: >
  TrafficSteering_rApp — the Wave 10.4 reference rApp
  (smo/docs/roadmap/WAVES_4_TO_10_WORK_ITEMS.md §10b). A Non-RT RIC rApp that
  forecasts each cell's congestion and moves load to its least-loaded
  neighbour: idle UEs via NRFreqRelation.cellReselectionPriority, connected
  UEs via NRCellRelation.cellIndividualOffset, through O1. No A1, Near-RT
  RIC, xApps or E2.

