  node_templates:
    applicationServiceDescriptor:
      type: tosca.nodes.asd
      description: "traffic-steering-rapp"
      properties:
        descriptor_id: 9f2e3d4c-5b6a-4f7e-8d9c-2b3c4d5e6f04
        descriptor_invariant_id: 9f2e3d4c-5b6a-4f7e-8d9c-2b3c4d5e0004
        descriptor_version: "1.0.0"
        schema_version: "2.0"
        function_description: "TrafficSteering_rApp — idle and connected mode load balancing over O1"
        provider: "Radisys"
        application_name: TrafficSteering_rApp
        application_version: "1.0.0"
