# Alembic configuration (PR-OPS-1; docs/adr/0001-schema-migrations.md). The database URL is not here: migrations/env.py
# takes it from SMO_DATABASE_URL like every service does (smo_shared.db.resolve_database_url).
[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = shared
path_separator = os
